Attention-Deficit/Hyperactivity Disorder (ADHD)`,title:`Describe the nature, and symptoms of ADHD.`,years:`Dec 2014 Q2`,answer:[{type:`heading`,level:3,text:`The Nature of ADHD: A Neurodevelopmental Disorder`},{type:`paragraph`,text:`Attention-Deficit/Hyperactivity Disorder (ADHD) is a chronic neurodevelopmental disorder characterized by a persistent, developmentally inappropriate pattern of inattention, hyperactivity, and impulsivity. In Indian clinical psychology, it is conceptualized as a structural and functional neurobiological anomaly rather than a behavioral problem caused by poor parenting or lack of discipline.`},{type:`heading`,level:4,text:`Neurobiological Underpinnings`},{type:`list`,items:[`Neurochemistry: Primarily driven by dysregulation of catecholamines (dopamine and norepinephrine) in the prefrontal cortex, leading to an "understimulated" brain struggling with executive control.`,`Brain Structures: Structural neuroimaging reveals volume reductions and delayed maturation (up to 3 years) in the prefrontal cortex, basal ganglia, and cerebellum.`,`Executive Function Deficits: According to Russell Barkley’s Hybrid Model, the core deficit is a failure of behavioral inhibition, which subsequently impairs working memory, internalization of speech, self-regulation of affect, and reconstitution.`,`Default Mode Network (DMN) Interference: The DMN fails to suppress cleanly during task performance, causing spontaneous mental intrusions manifesting as inattention and daydreaming.`]},{type:`heading`,level:4,text:`Genetic and Environmental Etiology`},{type:`paragraph`,text:`ADHD is highly inheritable (~70–80% heritability). Prenatal/perinatal risk factors include maternal distress, alcohol/nicotine exposure, low birth weight, and hypoxia. In India, authoritarian parenting, intense academic pressure, and high-density classrooms often exacerbate symptoms or accelerate referral rates.`},{type:`rule`},{type:`heading`,level:3,text:`Core Symptoms of ADHD`},{type:`paragraph`,text:`Per DSM-5-TR and ICD-11, symptoms must persist ≥6 months, be inconsistent with developmental level, and cause significant impairment in ≥2 settings.`},{type:`heading`,level:4,text:`Domain A: Inattention (IA)`},{type:`list`,items:[`Fails to give close attention to details; makes careless mistakes.`,`Difficulty sustaining attention in tasks/play.`,`Mind seems elsewhere when spoken to directly ("daydreaming").`,`Fails to follow through; leaves tasks unfinished.`,`Organizational deficits; poor time budgeting.`,`Avoids/dislikes sustained mental effort.`,`Loses essential items (notebooks, keys).`,`Easily distracted by extraneous stimuli.`,`Forgetful in daily activities.`]},{type:`heading`,level:4,text:`Domain B: Hyperactivity and Impulsivity (HI)`},{type:`list`,items:[`Fidgets, taps hands, squirms.`,`Leaves seat when remaining seated is expected.`,`Runs/climbs excessively (or inner restlessness in adults).`,`Inability to play/engage quietly.`,`"Driven by a motor"; boundless energy.`,`Talks excessively (logorrhea).`,`Blurts out answers before questions completed.`,`Difficulty waiting turn.`,`Interrupts/intrudes on others.`]},{type:`rule`},{type:`heading`,level:3,text:`Diagnostic Criteria, Subtypes, and Associated Features`},{type:`list`,items:[`Thresholds: Children (≤16): ≥6/9 symptoms; Adults (≥17): ≥5/9 symptoms. Onset before age 12; pervasive across ≥2 settings.`,`Presentations: Predominantly Inattentive (often missed in girls), Predominantly Hyperactive-Impulsive, Combined.`,`Associated Features: Academic/cognitive deficits (SLD comorbidity), social immaturity/peer rejection, degraded self-esteem, high ODD/Conduct Disorder/Anxiety comorbidity.`,`Adult Manifestation: Motoric hyperactivity transforms into inner restlessness/logorrhea. Executive dysfunction appears as procrastination, disorganization, financial mismanagement. Emotional dysregulation often misdiagnosed as BPD/Bipolar II.`]},{type:`rule`},{type:`heading`,level:3,text:`Standardized Indian Neuropsychological Diagnostic Battery`},{type:`paragraph`,text:`Diagnosis relies on multi-method assessment to rule out intellectual/specific learning disorders:`},{type:`list`,items:[`Malin’s Intelligence Scale for Indian Children (MISIC): Indian WISC adaptation; ADHD shows dips in Distractibility Index (Arithmetic/Digit Span).`,`Bhatia Battery of Performance Test of Intelligence: Non-verbal alternative highlighting visual-spatial planning/processing speed deficits.`,`Conners’ Rating Scales (Revised): Parent/teacher questionnaires mapping cross-situational pervasiveness.`,`Continuous Performance Test (CPT): Computerized task providing objective data on omission errors (inattention) and commission errors (impulsivity).`]}],cue:`Nature: Neurodevelopmental, Dopamine/Norepinephrine Dysregulation, Prefrontal-Basal Ganglia-Cerebellum Delay, Barkley's Behavioral Inhibition Deficit, DMN Intrusion. Symptoms: IA (9 items), HI (9 items). Thresholds: Child ≥6, Adult ≥5, Onset <12, ≥2 Settings. Indian Assessment: MISIC (Distractibility Index), Bhatia Battery, Conners, CPT.`,examUse:`Format: 20-mark essay. Rule: Must explicitly describe BOTH nature (neurobiology) AND symptoms (IA/HI domains). High-Yield Focus: Barkley's Hybrid Model (Behavioral Inhibition as core), DMN interference mechanism, Age-specific thresholds (Child vs Adult). Critical Note: Always include Indian neuropsychological battery (MISIC/Bhatia/CPT) to demonstrate localized diagnostic competence beyond DSM criteria alone.`},{id:`q-36`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Attention-Deficit/Hyperactivity Disorder (ADHD)`,title:`Describe the clinical features and causes of ADHD.`,years:`Dec 2016 Q1`,answer:[{type:`heading`,level:3,text:`Clinical Features of Attention Deficit Hyperactivity Disorder (ADHD)`},{type:`paragraph`,text:`Attention Deficit Hyperactivity Disorder (ADHD) is a neurodevelopmental disorder characterised by a persistent pattern of inattention, hyperactivity, and impulsivity that interferes with functioning or development. In Indian clinical psychology, diagnosis follows DSM-5-TR or ICD-11 criteria while accounting for socio-cultural dynamics and academic pressures. Symptoms must persist ≥6 months, be present in ≥2 settings, and cause clinically significant impairment.`},{type:`heading`,level:4,text:`Core Symptom Domains`},{type:`list`,items:[`Inattention: Fails to give close attention/makes careless mistakes; difficulty sustaining attention; does not seem to listen; fails to follow through/finish tasks; organizational deficits; avoids sustained mental effort; loses necessary items; easily distracted; forgetful in daily activities.`,`Hyperactivity: Fidgets/squirms; leaves seat when expected to remain seated; runs/climbs excessively; difficulty playing quietly; "on the go"/"driven by a motor"; talks excessively.`,`Impulsivity: Blurts out answers before questions completed; difficulty awaiting turn; interrupts/intrudes on others.`]},{type:`heading`,level:4,text:`Neuropsychological Underpinnings`},{type:`paragraph`,text:`Behavioral manifestations are outward projections of major deficits in Executive Functions (EF) mediated by prefrontal-striatal networks, including working memory decay and behavioral inhibition failures. Children often exhibit "Hot" Executive Dysfunction, manifesting as Rejection Sensitive Dysphoria (RSD)—extreme emotional sensitivity where minor criticism is perceived as catastrophic rejection. Associated features include clumsiness, poor fine motor skills, and time perception deficits.`},{type:`rule`},{type:`heading`,level:3,text:`Causes of ADHD`},{type:`paragraph`,text:`ADHD results from a combination of genetic, neurobiological, environmental, and socio-cultural factors:`},{type:`heading`,level:4,text:`Genetic Vulnerabilities`},{type:`paragraph`,text:`Twin studies confirm high heritability. Specific gene variants are associated with thinner brain tissue in attention-related regions. Understanding these genes may lead to prevention strategies and targeted treatments.`},{type:`heading`,level:4,text:`Neurobiological and Neurochemical Factors`},{type:`list`,items:[`Neurochemistry: Driven by dysregulation of catecholamines (dopamine and norepinephrine) in the prefrontal cortex, creating an "understimulated" brain struggling with executive control.`,`Brain Structures: Volume reductions and delayed maturation (up to 3 years) in the prefrontal cortex, basal ganglia, and cerebellum.`,`Default Mode Network (DMN) Interference: DMN fails to suppress during task performance, causing spontaneous mental intrusions manifesting as inattention/daydreaming.`]},{type:`heading`,level:4,text:`Environmental and Prenatal Factors`},{type:`list`,items:[`Prenatal exposure to cigarette smoking and alcohol increases risk.`,`Early childhood lead exposure (from plumbing/paint in old buildings) elevates susceptibility.`,`Traumatic brain injury can produce ADHD-like behaviors, though only a small percentage of cases stem from this cause.`]},{type:`heading`,level:4,text:`Neuroanatomical Abnormalities`},{type:`paragraph`,text:`MRI studies reveal smaller right-sided basal structures associated with attention, reduced corpus callosum size connecting frontal lobes, and decreased frontal lobe activity. Functional imaging shows inefficient neural processing requiring broader brain activation for tasks that neurotypical individuals complete with focused regional engagement.`},{type:`heading`,level:4,text:`The Indian Socio-Cultural Context`},{type:`paragraph`,text:`Authoritarian parenting styles, intense academic pressure, and high-density classroom environments in India often exacerbate symptoms or accelerate referral rates to Child Guidance Clinics, making cultural contextualization essential for accurate assessment.`}],cue:`Clinical Features: IA (9 items), HI (6 items), Impulsivity (3 items). Neuropsych: EF Deficits (Working Memory/Inhibition), Hot EF (RSD). Causes: Genetic Heritability, Dopamine/Norepinephrine Dysregulation, Prefrontal-Basal Ganglia-Cerebellum Delay, DMN Interference, Prenatal Toxins (Alcohol/Nicotine/Lead), Brain Injury, Indian Context (Authoritarian Parenting/Academic Pressure).`,examUse:`Format: 20-mark essay. Rule: Must cover BOTH clinical features AND etiology comprehensively. High-Yield Focus: Barkley's Behavioral Inhibition Model, DMN interference mechanism, Catecholamine hypothesis, DSM-5-TR diagnostic thresholds. Critical Note: Always integrate Indian socio-cultural exacerbating factors (academic pressure, authoritarian parenting) to demonstrate contextual competence beyond Western biomedical models.`},{id:`q-41`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Autism Spectrum Disorder (ASD)`,title:`Describe ASD. How can parents and teachers identify children with ASD?`,years:`June 2012 Q2`,answer:[{type:`heading`,level:3,text:`Clinical Description of Autism Spectrum Disorder (ASD)`},{type:`paragraph`,text:`Autism Spectrum Disorder (ASD) is a complex neurodevelopmental condition characterized by persistent deficits in social communication and interaction, alongside restricted, repetitive patterns of behavior, interests, or activities. Symptoms typically manifest in early childhood and significantly impair daily functioning across social, occupational, and academic domains. Diagnostically classified under neurodevelopmental disorders in DSM-5-TR and ICD-11, ASD is a spectrum condition with wide variability in intensity and presentation.`},{type:`heading`,level:4,text:`Core Deficits in Social Communication`},{type:`list`,items:[`Social-Emotional Reciprocity: Difficulty initiating/responding to interactions; failure to engage in back-and-forth conversation; reduced sharing of interests/emotions.`,`Nonverbal Communication: Marked impairments in eye contact, body language, facial expressions, and gestures.`,`Relationship Management: Challenges developing/maintaining relationships; difficulty adjusting behavior to social contexts; impaired imaginative play.`]},{type:`heading`,level:4,text:`Restricted and Repetitive Behaviors`},{type:`list`,items:[`Stereotyped Movements: Hand-flapping, rocking, echolalia, or repetitive object use (lining up toys).`,`Insistence on Sameness: Extreme distress over small routine changes; rigid thinking; need for identical routes/foods.`,`Highly Fixated Interests: Abnormal intensity/focus on narrow interests (train schedules, appliance cycles).`,`Sensory Hypo/Hyper-reactivity: Aversion to textures, indifference to pain/temperature, fascination with lights/spinning objects.`]},{type:`rule`},{type:`heading`,level:3,text:`How Parents Can Identify ASD (Home Setting)`},{type:`paragraph`,text:`Parents are usually the first to notice deviations around 12–24 months. Key markers include:`},{type:`list`,items:[`Lack of Joint Attention: Does not look at pointed objects or point to show interest.`,`Delayed Speech or Regression: Significant language delays or sudden loss of previously acquired words/social skills.`,`Unresponsiveness to Name: Frequently ignores name being called (often mistaken for hearing impairment).`,`Atypical Eye Contact: Avoids direct gaze or uses peripheral vision.`,`Lack of Social Smiling: Fails to smile back or respond to peek-a-boo/emotional cues.`,`Fixation on Toy Components: Spins wheels repeatedly instead of functional play.`]},{type:`rule`},{type:`heading`,level:3,text:`How Teachers Can Identify ASD (School Setting)`},{type:`paragraph`,text:`Teachers observe the child alongside peers in structured environments. Key classroom markers include:`},{type:`list`,items:[`Parallel Play: Plays alone alongside others rather than interacting/cooperating.`,`Inability to Follow Group Routines: Severe distress/outbursts during transitions (classwork to recess).`,`Literal Interpretation: Cannot understand idioms, metaphors, sarcasm, or humor.`,`Difficulty with Unstructured Time: Anxiety/dysregulation during free time, lunch, or assemblies.`,`Atypical Communication: Formal/robotic speech, unusual pitch/tone, or repeating instructions instead of answering.`,`Sensory Overload: Covering ears during bells, crying in crowded lines, distraction by fluorescent lights.`]},{type:`rule`},{type:`heading`,level:3,text:`Advanced Etiology and Cognitive Theories`},{type:`paragraph`,text:`ASD is multifactorial with ~60–90% heritability. Neurobiologically, it involves early brain overgrowth, long-range under-connectivity paired with local short-range over-connectivity (Connectivity Hypothesis), and Mirror Neuron System dysfunction.`},{type:`paragraph`,text:`Three prominent cognitive models explain the autistic mind:`},{type:`rule`},{type:`heading`,level:3,text:`Indian Context and Assessment Tools`},{type:`paragraph`,text:`Clinical psychologists in India supplement observations with standardized tools aligned with the Rights of Persons with Disabilities (RPwD) Act, 2016:`},{type:`list`,items:[`ISAA (Indian Scale for Assessment of Autism): Indigenous NIEPID tool assessing severity across 6 domains for disability certification.`,`INCLEN ASD Tool: Diagnostic instrument developed specifically for Indian socio-cultural contexts.`,`Global Standards: CARS-2 and ADOS-2 widely adapted across major medical centers.`,`Neurocognitive Profiling: Binet-Kamat Test (BKT), Malin’s Intelligence Scale (MISIC), and Vineland Social Maturity Scale (VSMS - Indian Adaptation).`]},{type:`paragraph`,text:`Socio-Cultural Dynamics: Joint families may buffer stimulation but delay detection via cultural rationalizations. Stigma leads to faith healer reliance; high-functioning girls often mask symptoms through passive compliance, leading to under-diagnosis.`}],cue:`Core Domains: Social Communication (Reciprocity/Nonverbal/Relationships) + Restricted/Repetitive (Stereotypy/Sameness/Fixations/Sensory). Identification: Parents (Joint Attention/Regression/No Response to Name); Teachers (Parallel Play/Literal Interpretation/Sensory Overload). Theories: ToM, Executive Dysfunction, Weak Central Coherence. Indian Tools: ISAA, INCLEN, BKT/MISIC/VSMS.`,examUse:`Format: 20-mark essay. Rule: Must describe BOTH clinical features AND specific identification strategies for parents AND teachers separately. High-Yield Focus: Joint Attention as earliest marker, Sensory Reactivity as key diagnostic criterion, ISAA for RPwD certification. Critical Note: Always mention Indian assessment tools (ISAA/INCLEN) and gender masking phenomenon to demonstrate contextual competence beyond Western DSM criteria.`},{id:`q-42`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Autism Spectrum Disorder (ASD)`,title:`Describe the nature and clinical symptoms of ASD.`,years:`June 2014 Q2`,answer:[{type:`heading`,level:3,text:`The Nature of Autism Spectrum Disorder (ASD)`},{type:`paragraph`,text:`Autism Spectrum Disorder (ASD) is a complex, lifelong neurodevelopmental condition characterized by persistent deficits in social communication and social interaction across multiple contexts, alongside restricted, repetitive patterns of behavior, interests, or activities. In advanced Indian clinical frameworks (NIMHANS/CIP), ASD is understood as a structural and functional brain anomaly affecting perception and processing, not merely a behavioral disorder.`},{type:`paragraph`,text:`The term "spectrum" reflects wide variation in challenges and strengths, ranging from mild to severe presentations. Symptoms typically manifest in early development and cause clinically significant impairment. ASD frequently co-occurs with intellectual disability, ADHD, anxiety, or epilepsy.`},{type:`heading`,level:4,text:`Neurobiological and Cognitive Underpinnings`},{type:`list`,items:[`Connectivity Hypothesis: Pattern of long-range under-connectivity (between distant regions like frontal lobe and higher-order cortex) paired with local short-range over-connectivity. This explains excellence at hyper-isolated tasks but difficulty with complex social-emotional integration requiring multi-region synthesis.`,`Mirror Neuron System (MNS) Dysfunction: Structural deficits in premotor cortex and inferior parietal lobule impair innate ability to mirror/imitate others' actions, leading to empathy and social learning difficulties.`,`Cognitive Theories: Theory of Mind (ToM) Deficit: "Mind-blindness"; inability to attribute mental states (beliefs, desires, intentions) to self/others.`,`Weak Central Coherence (WCC): Local processing bias; intense focus on fine details while missing global context.`,`Executive Dysfunction: Prefrontal deficits in planning, working memory, flexibility, and inhibition explaining distress over transitions and need for sameness.`]},{type:`heading`,level:4,text:`Genetic and Environmental Etiology`},{type:`paragraph`,text:`High heritability (~60–90%), associated with Fragile X, Tuberous Sclerosis, and de novo mutations. Environmental risks include advanced parental age, maternal immune activation during pregnancy, and prenatal valproic acid exposure.`},{type:`rule`},{type:`heading`,level:3,text:`Clinical Symptoms of ASD`},{type:`paragraph`,text:`Per DSM-5-TR and ICD-11, symptoms must be present in early developmental period and cause significant impairment across two core domains:`},{type:`heading`,level:4,text:`Domain A: Deficits in Social Communication and Interaction`},{type:`heading`,level:4,text:`Domain B: Restricted, Repetitive Patterns of Behavior, Interests, or Activities`},{type:`list`,items:[`Hyper-reactivity: Adverse response to sounds (covering ears), textures (refusing clothes/foods), lights.`,`Hypo-reactivity: Indifference to pain, temperature, loud noises.`,`Unusual Interest: Visual fascination with lights/movement/spinning; excessive smelling/touching.`]},{type:`rule`},{type:`heading`,level:3,text:`Associated Features and Comorbidities`},{type:`list`,items:[`Intellectual Disability: Wide range; some have profound ID, others average/superior intelligence (especially visuospatial).`,`Language Delays: Significant spoken language delays; some remain non-verbal requiring AAC.`,`Motor Clumsiness: Odd gait, poor coordination, fine motor difficulties (handwriting).`,`Sleep/GI Issues: Chronic insomnia, irregular sleep-wake cycles, constipation/reflux highly prevalent.`,`Psychiatric Comorbidities: ADHD (30–50%), Anxiety Disorders (social anxiety/phobias), Depression (high-functioning adolescents/adults), Epilepsy (up to 30% by adolescence).`,`Self-Injurious Behavior: Head-banging, biting, scratching triggered by sensory overload/frustration/communication deficits.`]},{type:`rule`},{type:`heading`,level:3,text:`Differential Diagnosis`},{type:`list`,items:[`Social (Pragmatic) Communication Disorder (SCD): Social communication deficits present BUT no restricted/repetitive behaviors or sensory anomalies.`,`Intellectual Disability (ID): Social skills match overall developmental age in pure ID; in ASD, social deficits are disproportionately severe vs. cognitive level.`,`Reactive Attachment Disorder (RAD): Caused by severe neglect; improves significantly with nurturing care unlike persistent neurodevelopmental ASD.`,`Childhood Schizophrenia: Later onset (post-puberty); features active hallucinations/delusions absent in ASD core presentation.`]}],cue:`Nature: Neurodevelopmental, Connectivity Hypothesis (Long-Range Under/Local Over), MNS Dysfunction, ToM/WCC/Executive Dysfunction Triad. Symptoms: Domain A (Reciprocity/Nonverbal/Relationships), Domain B (Stereotypy/Sameness/Fixations/Sensory). Associated: ID/Language/Motor/Sleep-GI/Psych Comorbidities/SIB. Differential: SCD vs ID vs RAD vs Childhood Schizophrenia.`,examUse:`Format: 20-mark essay. Rule: Must explicitly describe BOTH nature (neurobiology/cognition) AND clinical symptoms (Domains A+B). High-Yield Focus: Connectivity Hypothesis mechanism, Three Cognitive Theories (ToM/WCC/EF), Sensory Reactivity as diagnostic criterion. Critical Note: Always include differential diagnosis distinctions (especially SCD vs ASD) and comorbidity rates to demonstrate comprehensive clinical understanding.`},{id:`q-44`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Autism Spectrum Disorder (ASD)`,title:`Explain the clinical features of ASD.`,years:`Dec 2019 Q5`,answer:[],cue:``,examUse:``},{id:`q-47`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Autism Spectrum Disorder (ASD)`,title:`Write in detail on: Autism Spectrum Disorder from DSM-IV to DSM-V, and its levels`,years:`July 2021-Jan 2022 TMA Q10, July 2023-Jan 2024 TMA Q11, July 2024-Jan 2025 TMA Q9, June 2017 Q10a, Dec 2021 Q10a`,answer:[{type:`heading`,level:3,text:`The Paradigm Shift: From DSM-IV to DSM-5/DSM-5-TR`},{type:`paragraph`,text:`The transition from DSM-IV-TR (2000) to DSM-5 (2013) and DSM-5-TR (2022) marked a radical restructuring in the conceptualization of Autism. This shift moved away from distinct categorical diagnoses toward a unified, dimensional spectrum model based on empirical evidence that these conditions share common underlying neurobiological and behavioral features.`},{type:`heading`,level:4,text:`DSM-IV-TR: The Categorical Approach (The PDD Umbrella)`},{type:`paragraph`,text:`In DSM-IV, autism-related disorders were classified under "Pervasive Developmental Disorders" (PDDs) as five distinct, mutually exclusive diagnoses:`},{type:`list`,items:[`Autistic Disorder: Significant impairments in social interaction, communication, and restricted/repetitive behaviors; onset before age 3.`,`Asperger’s Disorder: Social deficits and restricted interests but without clinically significant delays in language or cognitive development.`,`Childhood Disintegrative Disorder (CDD): Normal development for ≥2 years followed by severe regression in multiple areas.`,`PDD-NOS: Subthreshold diagnosis for individuals with autistic traits not meeting full criteria.`,`Rett’s Disorder: Initially included but later removed upon identification as a specific genetic disorder (MECP2 mutation).`]},{type:`paragraph`,text:`Critique: Poor inter-rater reliability (Kappa <0.40 for Asperger’s vs PDD-NOS), site-specific diagnostic variance, and lack of longitudinal stability suggested these were not distinct entities but variations of the same core condition.`},{type:`heading`,level:4,text:`DSM-5 & DSM-5-TR: The Dimensional Spectrum Approach`},{type:`paragraph`,text:`DSM-5 collapsed previous subcategories into a single diagnosis: Autism Spectrum Disorder (ASD), driven by factor analytic studies demonstrating autistic traits exist on a singular continuous dimension.`},{type:`list`,items:[`Unified Diagnosis: All previous PDDs (except Rett’s) encompassed under ASD.`,`From Triad to Dyad: DSM-IV Triad: Social Interaction + Communication + Restricted/Repetitive Behaviors.`,`DSM-5 Dyad: (1) Deficits in Social Communication and Social Interaction (merges social/communication domains); (2) Restricted, Repetitive Patterns of Behavior, Interests, or Activities (RRBs). Crucially, RRBs now explicitly include sensory anomalies.`]},{type:`rule`},{type:`heading`,level:3,text:`Mapping Old Categories to New Severity Levels`},{type:`table`,headers:[`Historical DSM-IV Category`,`Modern DSM-5-TR Placement`,`Core Intellectual Profile`,`Language Development Profile`],rows:[[`Asperger’s Disorder`,`ASD Level 1 (Without intellectual/language impairment)`,`Average to Superior IQ`,`Normal structural language; pragmatic deficits only`],[`Autistic Disorder (Classic/Kanner’s)`,`ASD Level 2 or 3 (Varied intellectual/language impairment)`,`Often comorbid IDD`,`Marked delays; non-verbal or simple functional phrases`],[`Childhood Disintegrative Disorder`,`ASD Level 3 (With history of developmental regression)`,`Severe cognitive impairment post-regression`,`Complete/near-complete loss of fluent speech`],[`PDD-NOS`,`ASD Level 1 or 2 OR Social Communication Disorder`,`Highly variable`,`Mild-moderate impairments; if no RRBs → SCD`]]},{type:`paragraph`,text:`Critical Note on CDD: In Indian neuropsychology setups, late-onset regression requires extensive medical profiling to rule out progressive neurological conditions, pediatric autoimmune neuropsychiatric disorders, or subclinical epileptic encephalopathies (e.g., Landau-Kleffner syndrome) before assigning ASD Level 3 regression tag.`},{type:`rule`},{type:`heading`,level:3,text:`Severity Levels in DSM-5/DSM-5-TR`},{type:`paragraph`,text:`Severity levels capture heterogeneous nature of the spectrum based on amount of support required. An individual can have different severity levels for Social Communication and RRBs.`},{type:`table`,headers:[`Level`,`Description`,`Social Communication Domain`,`Restricted, Repetitive Behaviors (RRBs) Domain`],rows:[[`Level 1`,`"Requiring Support"`,`Deficits cause noticeable impairments without supports. Difficulty initiating interactions; atypical/unsuccessful responses to social overtures. Decreased interest in social interactions.`,`Inflexibility causes significant interference in ≥1 contexts. Difficulty switching activities. Organization/planning problems hamper independence.`],[`Level 2`,`"Requiring Substantial Support"`,`Marked deficits even with supports. Limited initiation; reduced/abnormal responses. Speaks in simple sentences.`,`Inflexibility/change difficulty obvious to casual observer; interferes across contexts. Distress changing focus/action.`],[`Level 3`,`"Requiring Very Substantial Support"`,`Severe deficits causing severe functional impairment. Very limited initiation; minimal response. May be nonverbal.`,`Extreme difficulty coping with change; markedly interferes in all spheres. Great distress changing focus. Stereotyped motor behaviors dominate daily routine.`]]},{type:`paragraph`,text:`Clinical Utility: Levels are dynamic (change with development/intervention/environment), guide support planning (1:1 aide vs resource room), and avoid hierarchical "high/low functioning" labels.`},{type:`rule`},{type:`heading`,level:3,text:`Indian Clinical Context: Assessment, Legal Frameworks, and Challenges`},{type:`list`,items:[`ISAA Cross-Walk: India’s primary legal tool is the Indian Scale for Assessment of Autism (ISAA). Mild (70–106) ≈ Level 1; Moderate (107–153) ≈ Level 2; Severe (>153) ≈ Level 3.`,`Level 1 "Floor Effect" Dilemma: Under RPwD Act, 2016, ISAA score ≥70 (≥40% disability) required for Disability Certificate. Level 1 individuals with intact language/IQ often score below 70, denying legal accommodations despite valid DSM-5 diagnosis. Solution: Supplement ISAA with executive functioning batteries (NIMHANS Neuropsychological Battery) to demonstrate functional impairment.`,`Socio-Cultural Confounders: Joint families foster collective denial ("spoke late but turned out fine"); Karma stigma delays help-seeking; Level 1 inattentiveness misattributed to shyness in large classrooms; Level 2 hyper-reactivity dismissed as poor parenting.`,`Intervention Mapping: Level 1 → Social Skills Training (collectivistic norms), CBT, Executive Function Coaching. Level 2 → Intensive ABA, Sensory Integration, Multilingual Speech Therapy. Level 3 → AAC/PECS, Heavy OT, Pharmacotherapy for comorbidities.`]}],cue:`Paradigm Shift: DSM-IV PDD Categories (Asperger's/Autistic/CDD/PDD-NOS) → DSM-5 Unified ASD Dyad (Social Comm + RRBs/Sensory). Severity Levels: Level 1 (Support), Level 2 (Substantial), Level 3 (Very Substantial). Indian Context: ISAA Cross-Walk, RPwD Act Floor Effect for Level 1, Joint Family Denial, Karma Stigma.`,examUse:`Format: Long essay/TMA. Rule: Must explicitly contrast DSM-IV categories vs DSM-5 dyad AND detail all three severity levels with domain-specific descriptors. High-Yield Focus: Sensory inclusion in DSM-5 RRBs, Level 1 Floor Effect under RPwD Act, ISAA cross-walk mapping. Critical Note: Always mention CDD regression differential diagnosis and Level 1 legal accommodation paradox to demonstrate advanced Indian clinical competence.`},{id:`q-50`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Intellectual Disability (formerly Mental Retardation)`,title:`Explain the causes of Intellectual Disability.`,years:`June 2018 Q5, June 2020 Q5`,answer:[{type:`heading`,level:3,text:`Nature and Definition of Intellectual Disability (ID)`},{type:`paragraph`,text:`Intellectual Disability (Intellectual Developmental Disorder) is a neurodevelopmental disorder characterized by significant limitations in both intellectual functioning (reasoning, problem-solving, planning) and adaptive functioning (conceptual, social, practical skills). Deficits originate during the developmental period (before age 18). In DSM-5-TR and ICD-11, severity is determined by adaptive functioning levels rather than IQ scores alone.`},{type:`paragraph`,text:`Causes are diverse and multifactorial, categorized by timing (Prenatal, Perinatal, Postnatal) and etiology (Biological vs. Sociocultural).`},{type:`rule`},{type:`heading`,level:3,text:`1. Prenatal Causes (Before Birth)`},{type:`paragraph`,text:`Genetic anomalies and maternal health issues account for most severe ID cases.`},{type:`list`,items:[`Genetic and Chromosomal Abnormalities: Down Syndrome (Trisomy 21): Most common chromosomal cause.`,`Fragile X Syndrome: Most common inherited cause; FMR1 mutation impairs synaptic pruning, leaving immature dendritic spines.`,`CNVs/Microdeletions: Prader-Willi (15q11-q13), Williams Syndrome (7q11.23).`,`Single-Gene/Metabolic: PKU, Galactosemia, Tay-Sachs, Hurler syndrome, Neurofibromatosis Type 1, Tuberous Sclerosis.`]},{type:`list`,items:[`TORCH Complex: Toxoplasmosis, Rubella, CMV, Herpes Simplex.`,`Maternal Immune Activation: Pro-inflammatory cytokines (IL-6, TNF-α) crossing placenta causing neuroinflammation.`,`Teratogens: Fetal Alcohol Spectrum Disorders (L1CAM interference), Sodium Valproate (histone deacetylase inhibition → apoptosis).`,`Endocrinological: Iodine deficiency (Cretinism), subclinical maternal hypothyroxinemia impairing neuronal migration.`]},{type:`rule`},{type:`heading`,level:3,text:`2. Perinatal Causes (During Birth)`},{type:`paragraph`,text:`Events immediately before/during/after delivery causing hypoxic or mechanical brain injury:`},{type:`list`,items:[`Birth Asphyxia/Hypoxia: Glutamatergic excitotoxicity → NMDA overactivation → calcium influx → neuronal apoptosis in basal ganglia/cortex.`,`Prematurity/Low Birth Weight: <37 weeks or <1500g → intraventricular hemorrhage, incomplete neurodevelopment.`,`Birth Trauma: Mechanical injuries from difficult deliveries causing physical damage/intracranial bleeding.`,`Neonatal Jaundice (Kernicterus): Severe hyperbilirubinemia crossing blood-brain barrier (especially Rh incompatibility) causing profound neurodevelopmental damage.`]},{type:`rule`},{type:`heading`,level:3,text:`3. Postnatal and Environmental Causes`},{type:`paragraph`,text:`Injuries, illnesses, and systemic deprivations during infancy/early childhood:`},{type:`list`,items:[`CNS Infections: Bacterial meningitis, viral encephalitis, neurotuberculosis causing neural inflammation/scarring.`,`Traumatic Brain Injury: Accidental head trauma, falls, non-accidental trauma (shaken baby syndrome).`,`Environmental Toxins: Chronic lead exposure disrupting synaptic pruning/neurotransmitter systems.`,`Neurochemical Disruptions: BDNF/TrkB receptor deficiencies halting neuron maturation; defective GABAergic interneuron migration disrupting excitation-inhibition balance (explaining >30% epilepsy comorbidity).`]},{type:`rule`},{type:`heading`,level:3,text:`4. Socio-Cultural and Psychosocial Factors`},{type:`paragraph`,text:`In Indian clinical psychology, psychosocial deprivation disproportionately correlates with Mild ID, explained by the "Dual-Component" Model:`},{type:`list`,items:[`Severe Stimulus Deprivation: Environments lacking linguistic/emotional/cognitive stimulation impair early synaptic connectivity.`,`Chronic Childhood Malnutrition: SAM, kwashiorkor, marasmus during critical windows (up to age 5) permanently limit cognitive capacity.`,`Poverty/Institutionalisation: Extreme poverty, lack of healthcare, prolonged institutionalisation without primary caregiver restrict adaptive/intellectual trajectories.`]},{type:`rule`},{type:`heading`,level:3,text:`The Indian Socio-Epidemiological Context`},{type:`list`,items:[`Consanguinity: High endogamy rates (especially South India) elevate recessive genetic condition risks.`,`Public Health Gaps: Iodine deficiency, rubella immunization gaps, limited skilled birth attendants increasing asphyxia risk.`,`Environmental Hazards: Lead exposure in informal battery recycling/traditional medicines containing heavy metals.`]},{type:`paragraph`,text:`Understanding these causes is critical for prevention (primary/secondary/tertiary) and guiding families toward interventions under the Rights of Persons with Disabilities (RPwD) Act, 2016.`}],cue:`Prenatal: Genetic (Down/Fragile X/CNVs/PKU/TORCH/FASD/Iodine), Epigenetics. Perinatal: Asphyxia (Glutamate Excitotoxicity), Prematurity, Kernicterus. Postnatal: CNS Infections, TBI, Lead, BDNF/GABA Disruption. Sociocultural: Dual-Component Model (Organic vs Familial Mild ID), Stimulus Deprivation, Malnutrition. Indian Context: Consanguinity, Public Health Gaps, Environmental Toxins.`,examUse:`Format: 20-mark essay. Rule: Must categorize causes chronologically (Prenatal/Perinatal/Postnatal) AND distinguish Biological vs Sociocultural etiologies explicitly. High-Yield Focus: Fragile X synaptic pruning mechanism, Glutamatergic Excitotoxicity in asphyxia, Dual-Component Model for Mild ID, BDNF/GABA link to epilepsy comorbidity. Critical Note: Always integrate Indian socio-epidemiological factors (consanguinity, iodine deficiency, lead exposure) and RPwD Act relevance to demonstrate localized clinical competence.`},{id:`q-51`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Intellectual Disability (formerly Mental Retardation)`,title:`Define Intellectual Disability. Explain the types of Intellectual Disability.`,years:`Dec 2019 Q1`,answer:[{type:`heading`,level:3,text:`Definition of Intellectual Disability (Intellectual Developmental Disorder)`},{type:`paragraph`,text:`Intellectual Disability (ID), formerly known as mental retardation, is a neurodevelopmental disorder characterized by significant limitations in both intellectual functioning and adaptive behavior. This disability originates before age 18. Per DSM-5-TR and ICD-11, diagnosis relies on adaptive functioning rather than IQ alone.`},{type:`paragraph`,text:`Three criteria must be met:`},{type:`rule`},{type:`heading`,level:3,text:`Types (Severity Levels) of Intellectual Disability`},{type:`paragraph`,text:`ID is categorized into four severity levels based on support required in three adaptive domains: Conceptual (academic/learning), Social (interpersonal/communication), and Practical (self-care/daily living).`},{type:`table`,headers:[`Severity Level`,`Approx. IQ Range`,`Conceptual Domain`,`Social Domain`,`Practical Support Needed`],rows:[[`Mild`,`50–69`,`Up to 6th-grade skills; slower pace; basic literacy achievable.`,`Mature differences vs peers; concrete communication; struggles with subtle cues.`,`Independent living with minor assistance (banking/legal); unskilled/semi-skilled jobs.`],[`Moderate`,`35–49`,`Up to 2nd-grade skills; struggles with abstraction; rudimentary academics.`,`Simple spoken language; meaningful friendships but misinterprets nuances; needs guidance.`,`Self-care with reminders; sheltered/supported employment.`],[`Severe`,`20–34`,`Highly limited; little understanding of written language/numbers/money; relies on others for decisions.`,`Limited to single words/phrases/gestures; communication focused on immediate present/basic needs.`,`Continuous lifelong supervision for all ADLs (bathing/dressing/toileting); cannot live independently.`],[`Profound`,`<20`,`Very limited symbolic understanding; sensory-motor focused; may use objects goal-directedly.`,`Very limited speech/gesture comprehension; expresses desires via non-verbal cues (crying/laughing).`,`Complete 24/7 dependence on caregivers for all physical needs, health, and safety.`]]},{type:`rule`},{type:`heading`,level:3,text:`Standard Indian Psychometric Assessment Tools`},{type:`paragraph`,text:`Diagnosis requires culturally adapted instruments:`},{type:`list`,items:[`Intelligence Tests: Binet-Kamat Test (BKT), Malin’s Intelligence Scale for Indian Children (MISIC), NIEPID Indian Test of Intelligence, Seguin Form Board Test (non-verbal screening).`,`Adaptive Behavior Scales: Vineland Social Maturity Scale (VSMS - Indian Adaptation; calculates Social Age/Social Quotient), Behavioral Assessment Scale for Indian Children with Mental Retardation (BASIC-MR; 280 adaptive + 75 maladaptive behaviors).`]},{type:`rule`},{type:`heading`,level:3,text:`Legal Disability Quantification in India`},{type:`paragraph`,text:`Under the Rights of Persons with Disabilities (RPwD) Act, 2016, clinical scores translate to Disability Percentages for certification (minimum 40% required for benefits):`},{type:`list`,items:[`Borderline ID (IQ 70–79): ~25% disability.`,`Mild ID (IQ 50–69): ~59% disability.`,`Moderate ID (IQ 35–49): ~75% disability.`,`Severe ID (IQ 20–34): ~90% disability.`,`Profound ID (IQ 100% disability.`]},{type:`paragraph`,text:`Certification grants access to state resources, vocational training, inclusive education, and reservations. Management involves Applied Behavior Analysis (ABA) techniques and Individualized Education Programs (IEPs) tailored to functional baseline.`}],cue:`Definition Triad: Intellectual Deficits + Adaptive Deficits + Onset <18 Years. Four Severity Levels: Mild (50-69), Moderate (35-49), Severe (20-34), Profound (<20). Adaptive Domains: Conceptual, Social, Practical. Indian Tools: BKT, MISIC, VSMS, BASIC-MR. RPwD Act: Borderline 25%, Mild 59%, Moderate 75%, Severe 90%, Profound 100%.`,examUse:`Format: 20-mark essay. Rule: Must define ALL THREE diagnostic criteria explicitly AND detail all four severity levels with domain-specific descriptors. High-Yield Focus: Adaptive functioning over IQ for severity determination, VSMS Social Quotient calculation, RPwD Act percentage mapping. Critical Note: Always specify Indian assessment tools (BKT/MISIC/VSMS/BASIC-MR) and legal disability percentages under RPwD Act 2016 to demonstrate localized clinical competence beyond Western DSM categories.`},{id:`q-52`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Intellectual Disability (formerly Mental Retardation)`,title:`Define Intellectual Disability. Discussing the levels/specifiers of Intellectual Disability, elucidate the causes.`,years:`Dec 2021 Q9`,answer:[{type:`heading`,level:3,text:`Definition of Intellectual Disability`},{type:`paragraph`,text:`Intellectual Disability (ID), historically referred to as Mental Retardation, is a developmental disability with onset before age 18. It is defined by an intellectual functioning level (IQ) well below average, accompanied by significant limitations in adaptive functioning. Adaptive skills encompass communication, home-living, community resource use, health/safety, leisure, self-care, social skills, self-direction, functional academics, and work skills. The condition typically persists throughout adulthood.`},{type:`rule`},{type:`heading`,level:3,text:`Levels and Specifiers of Intellectual Disability`},{type:`paragraph`,text:`DSM-IV classifies ID into four degrees based on functioning and IQ scores. Additionally, the AAMR classification focuses on support intensity rather than limitations.`},{type:`table`,headers:[`Level`,`IQ Score Range`,`Prevalence`,`Characteristics and Functioning`],rows:[[`Mild`,`50–75`,`~85%`,`Academic skills up to 6th-grade level; often self-sufficient; may live independently with community/social support.`],[`Moderate`,`35–55`,`~10%`,`Work/self-care tasks with moderate supervision; childhood communication acquisition; successful function in supervised environments (group homes).`],[`Severe`,`20–40`,`~3–4%`,`Basic self-care and some communication mastery; many able to live in group homes.`],[`Profound`,`<20–25`,`~1–2%`,`Basic self-care/communication only with intensive training; often accompanied by neurological disorders; requires high structure/supervision.`]]},{type:`paragraph`,text:`AAMR Support Classification: Intermittent Support → Limited Support → Extensive Support → Pervasive Support (replacing deficit-based labels with needs-based framework).`},{type:`rule`},{type:`heading`,level:3,text:`Causes of Intellectual Disability`},{type:`paragraph`,text:`In approximately 35% of cases, etiology remains unidentified. Biological and environmental factors are primary contributors:`},{type:`heading`,level:4,text:`Genetic Factors (~5% of identified cases)`},{type:`list`,items:[`Inherited Abnormalities: Fragile X syndrome (most common inherited cause).`,`Single Gene Defects: Phenylketonuria (PKU) causing disability if untreated early.`,`Chromosomal Accidents: Down syndrome (Trisomy 21), Trisomy 18.`]},{type:`heading`,level:4,text:`Prenatal Illnesses and Infections`},{type:`list`,items:[`Fetal Alcohol Syndrome: Excessive alcohol intake during first trimester; affects ~1/600 children.`,`Substance Exposure: Drug abuse and cigarette smoking during pregnancy.`,`Maternal Infections: Rubella, toxoplasmosis, cytomegalovirus causing brain damage.`,`Maternal Conditions: Hypertension/toxemia reducing fetal oxygen flow.`,`CNS Birth Defects: Neural tube defects leading to hydrocephalus.`]},{type:`heading`,level:4,text:`Childhood Illnesses, Infections, and Injuries`},{type:`list`,items:[`Untreated Medical Conditions: Hyperthyroidism, whooping cough, measles, Hib disease.`,`CNS Infections: Meningitis and encephalitis causing brain swelling.`,`Traumatic Brain Injury: Blows or violent shaking to head (shaken baby syndrome).`]},{type:`heading`,level:4,text:`Environmental Factors`},{type:`list`,items:[`Severe Neglect: Lack of necessary mental/physical stimulation causing irreversible learning impairments.`,`Socioeconomic Deprivation: Poverty, malnutrition, unhealthy living conditions, inadequate medical care.`,`Toxin Exposure: Lead from old paint as known neurodevelopmental toxin.`]}],cue:`Definition: IQ Below Average + Adaptive Limitations + Onset <18. Four Levels: Mild (50-75/85%), Moderate (35-55/10%), Severe (20-40/3-4%), Profound (<20-25/1-2%). AAMR Supports: Intermittent/Limited/Extensive/Pervasive. Causes: Genetic (Fragile X/PKU/Down), Prenatal (FAS/TORCH/Hypoxia), Childhood (Meningitis/TBI), Environmental (Neglect/Poverty/Lead).`,examUse:`Format: 20-mark essay. Rule: Must define ID precisely AND detail all four severity levels with prevalence data AND categorize causes systematically. High-Yield Focus: Fragile X as most common inherited cause, Fetal Alcohol Syndrome mechanism, AAMR support-based classification vs DSM-IV IQ-based. Critical Note: Always mention that 35% of cases have unidentified etiology to demonstrate nuanced understanding beyond textbook certainty.`},{id:`q-53`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Neurodevelopmental Disorders (General)`,title:`Discuss the meaning and types of Neurodevelopmental Disorders (formerly Pervasive Developmental Disorders).`,years:`Dec 2022 Q1, Dec 2025 Q5-Set3`,answer:[{type:`heading`,level:3,text:`Meaning of Neurodevelopmental Disorders (Pervasive Developmental Disorders)`},{type:`paragraph`,text:`The term Pervasive Developmental Disorders (PDDs), now subsumed under Neurodevelopmental Disorders in DSM-5-TR, refers to a group of conditions involving delays in basic skills development, notably socialization, communication, and imagination. Children with these conditions often experience confusion in thinking and difficulty understanding their environment.`},{type:`paragraph`,text:`Although onset occurs far earlier than age 3, identification typically happens during toddlerhood when developmental milestones (walking, talking) are missed. The term "pervasive" is somewhat misleading; children generally have specific problem areas rather than global dysfunction across all domains. General symptoms include:`},{type:`list`,items:[`Difficulty with verbal/non-verbal communication and social interaction.`,`Unusual play patterns and difficulty adjusting to routine changes.`,`Repetitive body movements and altered sensory responses.`,`Tantrums, sleep difficulties, aggression, fearfulness, or anxiety.`]},{type:`rule`},{type:`heading`,level:3,text:`Types of Pervasive Developmental Disorders (DSM-IV-TR Classification)`},{type:`paragraph`,text:`While DSM-5 has unified most categories into Autism Spectrum Disorder, understanding the historical PDD classification remains clinically relevant for reviewing older records and understanding phenotypic variability.`},{type:`table`,headers:[`Disorder`,`Key Characteristics and Clinical Picture`],rows:[[`Autistic Disorder`,`Impaired communication, social interaction, and behavior. Features include failure to develop normal personal interactions, impaired eye contact/facial expressions, severe language delays, echolalia, lack of pretend play, repetitive behaviors (hand flapping/rocking), and sensory hypersensitivity/hyposensitivity.`],[`Rett’s Disorder`,`X-linked dominant neurological disorder affecting only girls (MECP2 mutation). Normal development for 6–18 months followed by stagnation and rapid regression. Hallmark: loss of purposeful hand use replaced by stereotyped hand wringing. Other features: speech loss, microcephaly, seizures, rigid gait, intermittent hyperventilation.`],[`Asperger Syndrome`,`Milder/higher-functioning range. Normal to above-average intelligence but significant social interaction difficulties, lack of empathy, one-sided conversations, intense absorption in special topics. No significant language/cognitive delay. Strengths may include detail focus and pattern recognition.`],[`Childhood Disintegrative Disorder (CDD)`,`Heller’s syndrome. Normal development until ages 2–4, then severe loss of previously acquired skills in ≥2 areas (language, social, play, motor, bowel/bladder). More dramatic regression than autism; far less common. Etiology unknown (possible genetic/autoimmune factors).`],[`PDD-NOS`,`Atypical autism. Impairment in social interaction plus abnormalities in communication OR behavior, but not meeting full classic autism criteria. Symptoms may appear after age 3; pattern varies widely. Lower incidence of severe intellectual disability relative to other PDDs.`]]}],cue:`Meaning: Delays in Socialization/Communication/Imagination + Onset <3 Years + Specific (Not Global) Dysfunction. Five PDD Types: Autistic Disorder, Rett's (MECP2/Hand Wringing/Girls Only), Asperger's (No Language Delay/High IQ), CDD (Regression After Age 2), PDD-NOS (Subthreshold/Atypical).`,examUse:`Format: 20-mark essay. Rule: Must define PDD meaning precisely AND detail all five DSM-IV types with distinguishing features. High-Yield Focus: Rett's gender specificity and MECP2 gene, CDD regression timeline vs Autistic Disorder early onset, Asperger's preserved language/cognition distinction. Critical Note: Always clarify that DSM-5 collapsed these into ASD spectrum except Rett's (removed as genetic condition), but historical PDD framework remains essential for clinical record interpretation.`},{id:`q-54`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Neurodevelopmental Disorders (General)`,title:`Write short notes on: Childhood-Onset Fluency Disorder (context: formerly CDD/ASD)`,years:`Dec 2017 Q10a, June 2020 Q6`,answer:[{type:`heading`,level:3,text:`Definition and Diagnostic Context`},{type:`paragraph`,text:`Childhood-Onset Fluency Disorder, commonly known as stuttering, is classified under Communication Disorders within the broader category of Neurodevelopmental Disorders in DSM-5. It is distinct from Pervasive Developmental Disorders (PDD) or Autism Spectrum Disorder (ASD). The reference to "formerly CDD" represents a conflation; Childhood Disintegrative Disorder (CDD) was a separate PDD subtype characterized by severe regression, whereas fluency disorders have always been categorized separately as communication deficits involving speech flow and timing.`},{type:`rule`},{type:`heading`,level:3,text:`Clinical Features`},{type:`paragraph`,text:`The disorder is characterized by disturbances in normal fluency and time patterning of speech inappropriate for age and language skills:`},{type:`list`,items:[`Sound and syllable repetitions.`,`Sound prolongations of consonants and vowels.`,`Broken words (pauses within a word).`,`Audible or silent blocking (filled/unfilled pauses).`,`Circumlocutions (word substitutions to avoid problematic words).`,`Words produced with excess physical tension.`,`Monosyllabic whole-word repetitions (e.g., "I-I-I-I see him").`]},{type:`rule`},{type:`heading`,level:3,text:`Onset and Course`},{type:`paragraph`,text:`Onset typically occurs between ages 2–7 years (median: 5 years). More common in males than females. For many children, the disorder is transient and resolves spontaneously; however, for a subset, it persists into adulthood causing significant social and occupational impairment.`},{type:`rule`},{type:`heading`,level:3,text:`Etiology`},{type:`paragraph`,text:`Multifactorial causes include:`},{type:`list`,items:[`Genetic Factors: Strong familial aggregation suggesting genetic predisposition.`,`Neurophysiological Factors: Abnormalities in brain areas responsible for speech motor control and timing.`,`Environmental Factors: High parental expectations, stress, or rapid language development may exacerbate but are not primary causes.`]},{type:`rule`},{type:`heading`,level:3,text:`Differentiation from ASD and CDD`},{type:`paragraph`,text:`Unlike ASD or former CDD, Childhood-Onset Fluency Disorder does not involve deficits in social reciprocity, restricted/repetitive behaviors, or global developmental regression. While individuals with ASD may exhibit echolalia or idiosyncratic speech patterns, the core deficit in fluency disorder is strictly related to motor production and flow of speech, not social communication intent or cognitive regression.`}],cue:`Classification: Communication Disorder (NOT PDD/CDD). Core Symptoms: Repetitions, Prolongations, Blocking, Circumlocutions, Physical Tension. Onset: 2-7 Years (Median 5), Male Predominance. Etiology: Genetic + Neurophysiological + Environmental Exacerbators. Key Distinction: Motor Speech Flow Deficit vs Social/Cognitive Regression.`,examUse:`Format: Short Notes. Rule: Must explicitly clarify diagnostic separation from CDD/ASD in first paragraph. High-Yield Focus: Seven clinical features list, Age 2-7 onset window, Multifactorial etiology triad. Critical Note: Always emphasize that this is a MOTOR SPEECH disorder, not a social-cognitive one, to prevent examiner confusion with ASD/PDD categories.`},{id:`q-55`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Tic & Anxiety Disorders in Children`,title:`Write short notes on: Tic Disorders (formerly Tick disorders)`,years:`June 2016 Q10a, July 2022-Jan 2023 TMA Q10`,answer:[{type:`heading`,level:3,text:`Definition and Clinical Features`},{type:`paragraph`,text:`A tic is a sudden, rapid, recurrent, non-rhythmic motor movement or vocalization. Tics are involuntary but can be suppressed voluntarily for brief periods, often leading to a buildup of tension relieved by executing the tic. They are classified into:`},{type:`list`,items:[`Motor Tics: Eye blinking, shoulder shrugging, head jerking.`,`Vocal Tics: Throat clearing, sniffing, grunting.`]},{type:`paragraph`,text:`Severity ranges from mild/hardly noticeable to severe/complex, significantly impacting social and occupational functioning.`},{type:`rule`},{type:`heading`,level:3,text:`Classification (DSM-IV-TR)`},{type:`table`,headers:[`Disorder`,`Key Characteristics and Duration Criteria`],rows:[[`Transient Tic Disorder`,`Most common (~10% of children). Tics persist ≥4 weeks but <12 months. Often resolve spontaneously; worsen with anxiety/fatigue/excitement.`],[`Chronic Motor or Vocal Tic Disorder`,`Single/multiple motor OR vocal tics (not both) present >1 year. Onset before age 18. Affects <1% of children.`],[`Tourette’s Disorder`,`Multiple motor tics AND ≥1 vocal tic present >1 year. Onset before age 18. Frequently comorbid with ADHD, OCD, learning disabilities. Coprolalia (obscene utterances) occurs but is rare.`]]},{type:`rule`},{type:`heading`,level:3,text:`Etiology`},{type:`paragraph`,text:`Exact cause unknown; believed to involve:`},{type:`list`,items:[`Neurotransmitter Abnormalities: Particularly dopamine dysregulation.`,`Structural Variations: In cortico-striato-thalamo-cortical (CSTC) loops.`,`Genetic Component: Strong familial aggregation.`,`Environmental Factors: Prenatal complications or perinatal stress may contribute.`]},{type:`rule`},{type:`heading`,level:3,text:`Management and Treatment`},{type:`paragraph`,text:`Treatment determined by severity and functional impairment:`},{type:`list`,items:[`Psychoeducation: Educating patient/family/teachers to reduce stigma. Punishment/scolding is counterproductive and increases distress.`,`Behavioral Therapy: Habit Reversal Training (HRT) and Comprehensive Behavioral Intervention for Tics (CBIT) help recognize premonitory urges and develop competing responses.`,`Pharmacotherapy: Antipsychotics (haloperidol, risperidone) or alpha-adrenergic agonists (clonidine) for severe cases causing significant impairment.`,`Supportive Environment: Reducing stress at home/school, as stress is a known exacerbating factor.`]}],cue:`Core Definition: Sudden/Rapid/Recurrent/Non-Rhythmic + Suppressible + Premonitory Urge. Three Types: Transient (&lt;12mo), Chronic Motor/Vocal Only (&gt;1yr), Tourette's (Motor+Vocal &gt;1yr). Etiology: Dopamine/CSTC Loops/Genetics. Management: Psychoeducation + HRT/CBIT + Pharmacotherapy (Antipsychotics/Clonidine).`,examUse:`Format: Short Notes. Rule: Must distinguish all three DSM-IV types explicitly by duration and tic combination criteria. High-Yield Focus: Premonitory urge concept, CSTC loop neurobiology, HRT/CBIT as first-line behavioral interventions. Critical Note: Always clarify that coprolalia is RARE in Tourette's despite popular misconception, and emphasize psychoeducation over punishment to prevent examiner bias toward punitive approaches.`},{id:`q-56`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Tic & Anxiety Disorders in Children`,title:`Write short notes on: Separation Anxiety Disorder`,years:`June 2022 Q10a, June 2023 Q10a`,answer:[{type:`heading`,level:3,text:`Definition and Clinical Features`},{type:`paragraph`,text:`Separation Anxiety Disorder (SAD) is an anxiety disorder characterized by excessive anxiety beyond that expected for the child’s developmental level, related to separation or impending separation from an attachment figure (e.g., primary caretaker). Per DSM criteria, it occurs in children under 18 years and lasts at least 4 weeks, causing clinically significant distress or functional impairment.`},{type:`paragraph`,text:`Key Symptoms:`},{type:`list`,items:[`Unrealistic worries about safety of loved ones or attachment figures.`,`Reluctance to fall asleep without being near the primary attachment figure.`,`Excessive distress (tantrums, crying) when separation is imminent.`,`Nightmares with separation-related themes.`,`Persistent homesickness or preoccupation with reunion.`,`Somatic Complaints: Especially frequent in older children/adolescents; include dizziness, nausea, stomach aches, cramps, vomiting, muscle aches, or palpitations. These often lead families to seek medical treatment for physical symptoms rather than underlying anxiety.`]},{type:`rule`},{type:`heading`,level:3,text:`Differentiation from Normal Anxiety`},{type:`paragraph`,text:`While separation anxiety is a normal part of early childhood development, SAD is distinguished by three critical factors:`},{type:`list`,items:[`Intensity: Fear is excessive and not proportional to actual threat.`,`Duration: Persists ≥4 weeks (vs. transient normative anxiety).`,`Developmental Inappropriateness: Continues beyond typical age range and causes significant impairment in social or academic functioning.`]}],cue:`Core Criteria: Excessive Anxiety + Attachment Figure Separation + Age <18 + Duration ≥4 Weeks + Functional Impairment. Key Symptoms: Safety Worries, Sleep Reluctance, Distress/Tantrums, Separation Nightmares, Somatic Complaints (GI/Cardiac). Differentiation: Intensity, Duration, Developmental Appropriateness.`,examUse:`Format: Short Notes. Rule: Must explicitly distinguish pathological SAD from normal developmental separation anxiety using intensity/duration/appropriateness triad. High-Yield Focus: Somatic presentation in older children as primary help-seeking reason, 4-week minimum duration criterion. Critical Note: Always emphasize that somatic complaints drive medical referrals before psychiatric recognition to demonstrate clinical awareness of diagnostic overshadowing.`},{id:`q-57`,segment:`THEME 2: NEURODEVELOPMENTAL & DISRUPTIVE DISORDERS > Disruptive, Impulse-Control & Conduct Disorders`,title:`Differentiate between Oppositional Defiant Disorder and Conduct Disorder.`,years:`Dec 2015 Q5, June 2016 Q5, Feb 2021 Q5, June 2017 Q5, June 2024 Q5, Dec 2024 Q5, June 2025 Q5, Dec 2025 Q5, Dec 2025 Q10a-Set3, Dec 2013 Q10a, July 2023-Jan 2024 TMA Q12`,answer:[{type:`heading`,level:3,text:`Core Distinction: Authority Conflict vs. Rights Violation`},{type:`paragraph`,text:`While both Oppositional Defiant Disorder (ODD) and Conduct Disorder (CD) are disruptive behavior disorders characterized by negativistic, defiant, and hostile behavior toward authority figures, they differ fundamentally in severity, nature of violations, and prognosis. ODD is primarily an emotional/behavioral regulation issue involving conflict with adults, whereas CD involves repetitive violation of the basic rights of others or major societal norms.`},{type:`table`,headers:[`Feature`,`Oppositional Defiant Disorder (ODD)`,`Conduct Disorder (CD)`],rows:[[`Core Nature`,`Recurrent pattern of negativistic, defiant, disobedient, hostile behavior toward authority figures. Emotional/behavioral dysregulation.`,`Repetitive/persistent pattern violating basic rights of others or major age-appropriate societal norms/rules.`],[`Severity of Violations`,`Non-compliance, arguing, annoyance. No serious legal violations or physical rights infringements.`,`Serious violations: physical cruelty, forced sexual activity, burglary, arson, truancy. Often illegal/harmful.`],[`Aggression`,`Typically verbal (arguing, blaming) or irritability/anger. Physical aggression not defining.`,`Physical/severe: bullying, threatening, fights, weapons use, cruelty to people/animals.`],[`Deceit and Theft`,`Not core feature. Lying usually minor/avoidance-related.`,`Core features: breaking into houses/cars, lying for goods/favors, stealing without confrontation.`],[`Rule Violations`,`Refusal to follow rules/directions. Does not typically involve staying out late (<13) or running away overnight.`,`Staying out at night despite prohibitions (<13), running away ≥2x overnight, frequent truancy (<13).`],[`Empathy and Remorse`,`May feel remorse/guilt after outbursts; often blames others. Lack of empathy not defining.`,`Lack of remorse/guilt, callous-unemotional traits, lack of concern for others' feelings/performance.`],[`Prognosis`,`Precursor to CD in subset; many do not progress. Milder behavioral dysregulation.`,`More severe/stable. Strong predictor of Antisocial Personality Disorder. Higher substance abuse/legal risks.`],[`Diagnostic Exclusion`,`Not diagnosed if behaviors occur exclusively during Mood/Psychotic Disorder.`,`Not diagnosed if behaviors better explained by another disorder (e.g., Manic Episode).`]]},{type:`heading`,level:3,text:`Summary of Distinction`},{type:`paragraph`,text:`The primary distinction lies in violation of others' rights and societal norms. ODD represents a struggle for power/control with authority (argumentativeness, irritability). CD represents disregard for others' rights (aggression, destruction, deceit, serious rule violations). While ODD can be viewed as milder behavioral dysregulation, CD constitutes severe antisocial behavior patterns.`}],cue:`Core Difference: ODD = Authority Conflict + Emotional Dysregulation; CD = Rights Violation + Antisocial Behavior. Key Discriminators: Aggression Type (Verbal vs Physical), Deceit/Theft Presence, Empathy/Remorse Levels, Rule Violation Severity, Prognosis (ODD→CD vs CD→ASPD). Callous-Unemotional Traits specific to CD.`,examUse:`Format: 20-mark essay. Rule: Must present differentiation across ALL eight dimensions explicitly. High-Yield Focus: Callous-Unemotional Traits as CD specifier, ODD as potential CD precursor but not inevitable progression, Age-13 threshold for serious rule violations. Critical Note: Always emphasize that ODD involves CONFLICT WITH AUTHORITY while CD involves VIOLATION OF OTHERS RIGHTS to prevent examiner confusion between the two disorders.`},{id:`q-62`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Define PTSD. Describe the treatment for PTSD.`,years:`Dec 2012 Q4, June 2013 Q2`,answer:[{type:`heading`,level:3,text:`Definition and Clinical Features of Post-Traumatic Stress Disorder`},{type:`paragraph`,text:`Post-Traumatic Stress Disorder (PTSD) is a psychiatric condition developed as an aftermath of severe trauma involving violence or demolition. The individual experiences, witnesses, or is confronted with events involving actual/threatened death, serious injury, or threat to integrity of self/others. Reactions are predominantly fear, helplessness, and terror.`},{type:`paragraph`,text:`Clinical features are categorized into three primary symptom clusters (DSM-IV framework referenced in source):`},{type:`paragraph`,text:`Symptoms must persist ≥1 month. Acute PTSD: Chronic PTSD: >3 months duration. Children may exhibit numbness, sleep disturbances, loss of developmental skills, or behavioral shifts. Survivor’s guilt, depression, substance abuse, and suicidal ideation are common comorbidities.`},{type:`rule`},{type:`heading`,level:3,text:`Treatment and Intervention Approaches`},{type:`paragraph`,text:`Treatment requires a phased approach addressing immediate stabilization and long-term integration.`},{type:`heading`,level:4,text:`Immediate/Acute Phase`},{type:`list`,items:[`Pharmacotherapy: SSRIs, antidepressants, and tranquilizers to ease acute terror.`,`Crisis Therapy: Proactive engagement providing information, support, and clarification.`]},{type:`heading`,level:4,text:`Long-Term Structured Psychotherapies`},{type:`list`,items:[`Trauma-Focused Cognitive-Behavioural Therapy (TF-CBT): Gradual exposure to avoided thoughts/feelings/situations while replacing erroneous/irrational thoughts with reality-oriented perspectives.`,`Eye Movement Desensitisation and Reprocessing (EMDR): Uses rhythmic left-right stimulation (eye movements/hand taps) to unfreeze brain's information processing, integrating stuck memories into cohesive autobiographical memory.`,`Narcosynthesis: Sodium pentathol induces drowsy state allowing vivid recounting of trauma for subsequent processing upon waking.`,`Rap Groups: Self-help forums (originally for veterans) to share experiences and work through residual guilt/anger.`,`Existential Logotherapy: Socratic dialogue to neutralize trauma of subhuman treatment by integrating it into broader existential meaning.`,`Family Therapy: Essential as trauma disrupts relationship systems; involves close persons to ensure supportive environment and guide navigation of aftermath.`]}],cue:`Definition: Trauma Exposure + Fear/Helplessness/Terror + 3 Clusters (Intrusion/Avoidance-Numbing/Arousal) + Duration ≥1 Month. Treatment Phases: Acute (SSRIs/Crisis Therapy) → Long-Term (TF-CBT, EMDR, Narcosynthesis, Rap Groups, Logotherapy, Family Therapy).`,examUse:`Format: 20-mark essay. Rule: Must define PTSD with 3 symptom clusters AND detail both acute and long-term treatments explicitly. High-Yield Focus: TF-CBT exposure component, EMDR bilateral stimulation mechanism, Distinction between Acute (<3mo) vs Chronic (>3mo). Critical Note: Always mention Family Therapy as essential due to systemic disruption, and Narcosynthesis/Rap Groups as historical/specific modalities to demonstrate comprehensive knowledge.`},{id:`q-65`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Discuss the role of psychological factors in the causation of PTSD.`,years:`Dec 2015 Q7`,answer:[{type:`heading`,level:3,text:`The Role of Psychological Factors in the Causation of PTSD`},{type:`paragraph`,text:`Psychological factors play a critical role in determining why some individuals succumb to PTSD while others do not, interacting with biological vulnerabilities and socio-cultural contexts.`},{type:`heading`,level:4,text:`Psychoanalytical Approach`},{type:`paragraph`,text:`PTSD results from the ego's struggle to assimilate repressed or suppressed painful memories. It represents a maladaptive compromise where the psyche fails to integrate traumatic material, leading to symptomatic expression through intrusion and avoidance.`},{type:`heading`,level:4,text:`Learning Theory Approach`},{type:`paragraph`,text:`PTSD is viewed as a classically conditioned avoidance response. Neutral stimuli present during the traumatic event become associated with terror. Subsequent exposure to these cues triggers conditioned fear responses, while avoidance behaviors are negatively reinforced by anxiety reduction, maintaining the disorder.`},{type:`heading`,level:4,text:`Cognitive Approach`},{type:`paragraph`,text:`Victims adopt faulty, emotion-focused coping mechanisms and distort information processing. Key cognitive distortions include:`},{type:`list`,items:[`Hyper-sensitivity to trauma-related cues.`,`Inappropriate personal responsibility or survivor guilt.`,`Catastrophic interpretations of safety and trust.`]},{type:`paragraph`,text:`These cognitive errors prevent the integration of the traumatic event into existing schemas, causing persistent distress.`},{type:`heading`,level:4,text:`Existential Approach`},{type:`paragraph`,text:`Trauma shatters fundamental expectations about life, safety, and relationships. When individuals cannot integrate horrific events into a meaningful framework, they experience nihilism, cynicism, and a loss of existential coherence. The inability to find meaning in suffering exacerbates symptom severity.`},{type:`heading`,level:4,text:`Interaction with Socio-Cultural Moderators`},{type:`paragraph`,text:`Psychological vulnerability is moderated by social context. Strong group morale, adequate social support, and cultural assimilation of the event protect against severe symptoms. Conversely, societal reactions like victim-blaming (especially in sexual assault) severely exacerbate risk and persistence by reinforcing shame and isolation.`}],cue:`Four Psychological Models: Psychoanalytic (Repression/Ego Struggle), Learning Theory (Classical Conditioning/Avoidance Reinforcement), Cognitive (Faulty Coping/Distortions/Survivor Guilt), Existential (Shattered Assumptions/Meaning Loss). Moderator: Social Support vs Victim-Blaming.`,examUse:`Format: 20-mark essay. Rule: Must explain ALL four psychological theories explicitly with their specific mechanisms. High-Yield Focus: Classical Conditioning for avoidance maintenance, Cognitive Distortions (Survivor Guilt), Existential Meaning-Making failure. Critical Note: Always link psychological factors to socio-cultural moderators (victim-blaming vs support) to demonstrate biopsychosocial integration beyond pure psychodynamics.`},{id:`q-67`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Describe the symptoms and clinical features of PTSD and present the treatment for the same.`,years:`June 2017 Q2, Dec 2016 Q2`,answer:[{type:`heading`,level:3,text:`Symptoms and Clinical Features of PTSD`},{type:`paragraph`,text:`PTSD develops after exposure to events involving actual/threatened death, serious injury, or threat to integrity. Reactions involve fear, helplessness, and terror. Symptoms persist ≥1 month and are categorized into three clusters:`},{type:`paragraph`,text:`Duration Classification: Acute (3 months). Demographic Variations: Children exhibit numbness, sleep disturbances, nightmares, loss of developmental skills, or behavioral shifts (outgoing to aggressive). Common comorbidities include survivor’s guilt, depression, substance abuse, and suicidal ideation. Onset can be immediate or delayed (months/years) when defense mechanisms fail or subsequent cues trigger original memory.`},{type:`rule`},{type:`heading`,level:3,text:`Treatment for PTSD`},{type:`paragraph`,text:`Treatment follows a phased approach:`},{type:`heading`,level:4,text:`Immediate Stabilization`},{type:`list`,items:[`Pharmacotherapy: SSRIs, antidepressants, tranquilizers for acute terror.`,`Crisis Therapy: Proactive support, information, and clarification.`]},{type:`heading`,level:4,text:`Long-Term Integration`},{type:`list`,items:[`Trauma-Focused CBT (TF-CBT): Gradual exposure to avoided stimuli + cognitive restructuring of irrational thoughts.`,`EMDR: Rhythmic left-right stimulation (eye movements/taps) to unfreeze information processing and integrate stuck memories.`,`Narcosynthesis: Sodium pentathol-induced drowsy state for vivid trauma recounting and subsequent processing.`,`Rap Groups: Veteran/self-help forums to share experiences and process guilt/anger.`,`Existential Logotherapy: Socratic dialogue to integrate trauma into broader existential meaning.`,`Family Therapy: Involves close persons to rebuild supportive relationship systems disrupted by trauma.`]}],cue:`Symptoms: Intrusion + Avoidance/Numbing + Arousal + Duration ≥1 Month. Demographics: Children (Developmental Regression/Behavioral Shifts). Comorbidities: Survivor Guilt/Substance Abuse/Suicidality. Treatment: Acute (SSRIs/Crisis) → Long-Term (TF-CBT/EMDR/Narcosynthesis/Rap Groups/Logotherapy/Family Therapy).`,examUse:`Format: 20-mark essay. Rule: Must list all 3 symptom clusters AND detail comprehensive treatment modalities including historical (Narcosynthesis/Rap Groups) and modern (EMDR/TF-CBT). High-Yield Focus: Delayed onset mechanism, Child-specific presentations, EMDR bilateral stimulation rationale. Critical Note: Always emphasize Family Therapy necessity due to systemic trauma impact to demonstrate holistic clinical understanding.`},{id:`q-70`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Discuss the etiology, prevention, and treatment of PTSD.`,years:`June 2021 Q2, Dec 2018 Q6, June 2020 Q1, June 2022 Q3, July 2022-Jan 2023 TMA Q2, Dec 2025 Q2-Set3`,answer:[{type:`heading`,level:3,text:`Etiology of PTSD`},{type:`paragraph`,text:`PTSD etiology is multifaceted, involving biological, psychological, and socio-cultural interactions:`},{type:`list`,items:[`Biological: Vulnerable personality traits (familial); noradrenergic system activation elevating norepinephrine → exaggerated startle/emotional arousal.`,`Psychological: Psychoanalytic: Ego struggle to assimilate repressed memories (maladaptive compromise).`,`Learning Theory: Classically conditioned avoidance; neutral stimuli paired with terror.`,`Cognitive: Faulty coping, distorted processing, hyper-sensitivity to cues, survivor guilt.`,`Existential: Shattered life expectations → nihilism/cynicism when meaning-making fails.`]},{type:`rule`},{type:`heading`,level:3,text:`Prevention Strategies`},{type:`paragraph`,text:`Primary prevention for high-risk groups (military/first responders) utilizes Stress Inoculation Training (SIT) in three stages:`},{type:`rule`},{type:`heading`,level:3,text:`Treatment and Intervention`},{type:`paragraph`,text:`Immediate Phase: SSRIs/antidepressants/tranquilizers for acute terror; short-term crisis therapy for support/clarification.`},{type:`paragraph`,text:`Long-Term Phase: TF-CBT: Gradual exposure + cognitive restructuring of irrational thoughts. EMDR: Bilateral stimulation (eye movements/taps) to unfreeze information processing and integrate memories. Narcosynthesis: Sodium pentathol-assisted trauma recounting. Rap Groups: Peer sharing to process guilt/anger. Logotherapy: Socratic dialogue for existential meaning integration. Family Therapy: Rebuilding supportive relationship systems.`}],cue:`Etiology Triad: Biological (Noradrenergic), Psychological (4 Models: Psychoanalytic/Learning/Cognitive/Existential), Socio-Cultural (Support vs Blaming). Prevention: Stress Inoculation Training (Info → Cognitive Prep → Simulated Exposure). Treatment: Acute (SSRIs/Crisis) → Long-Term (TF-CBT/EMDR/Narcosynthesis/Rap/Logotherapy/Family).`,examUse:`Format: Long essay. Rule: Must cover Etiology (all 3 domains), Prevention (SIT 3 stages), AND Treatment (acute + long-term modalities). High-Yield Focus: Noradrenergic hyperarousal mechanism, SIT staged protocol, EMDR bilateral stimulation, TF-CBT exposure component. Critical Note: Always integrate socio-cultural moderators (victim-blaming) in etiology and Family Therapy in treatment to demonstrate biopsychosocial competence.`},{id:`q-72`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Describe the different situations that may cause PTSD.`,years:`Dec 2022 Q6, Dec 2014 Q4, July 2024-Jan 2025 TMA Q3`,answer:[{type:`heading`,level:3,text:`Situational Triggers and Etiology of PTSD`},{type:`paragraph`,text:`PTSD can be elicited by various catastrophic situations, each carrying unique psychological burdens:`},{type:`heading`,level:4,text:`1. Military Combat`},{type:`paragraph`,text:`Involves horrors of warfare, moral conflicts, and profound survival guilt, particularly when soldiers witness the death of peers. The combination of life-threatening danger and moral injury creates complex trauma profiles.`},{type:`heading`,level:4,text:`2. Natural Disasters`},{type:`paragraph`,text:`Events such as earthquakes, cyclones, and tsunamis induce trauma characterized by absolute helplessness against destructive natural forces. Key stressors include sudden loss of loved ones, homes, and community infrastructure, leading to feelings of vulnerability and unpredictability.`},{type:`heading`,level:4,text:`3. Man-Made Disasters`},{type:`paragraph`,text:`Industrial accidents and terrorist attacks add layers of directionless anger and frustration toward perpetrators or systemic negligence. Unlike natural disasters, these events involve human intent or failure, complicating the grief process with betrayal and injustice.`},{type:`heading`,level:4,text:`4. Severe Threats to Personal Security`},{type:`paragraph`,text:`Includes rape, torture, domestic violence, or life-threatening accidents. These unfold through phases of apprehension, impact, recoil, and reconstruction, leaving victims with extreme fear and a shattered sense of security. Interpersonal violence often carries additional stigma and self-blame.`},{type:`heading`,level:4,text:`Common Psychological Mechanisms Across Situations`},{type:`paragraph`,text:`Regardless of trigger type, PTSD etiology involves: Biological: Noradrenergic activation → elevated norepinephrine → exaggerated startle/arousal. Psychological: Psychoanalytic (repressed memories), Learning (conditioned avoidance), Cognitive (faulty coping/guilt), Existential (shattered assumptions). Socio-Cultural: Social support protects; victim-blaming exacerbates.`}],cue:`Four Situational Categories: Military Combat (Moral Injury/Survival Guilt), Natural Disasters (Helplessness/Loss), Man-Made Disasters (Anger/Betrayal/Negligence), Personal Security Threats (Rape/DV/Accidents → Shattered Security). Universal Mechanisms: Noradrenergic Arousal + Psychological Models (Psychoanalytic/Learning/Cognitive/Existential) + Socio-Cultural Moderators.`,examUse:`Format: 20-mark essay. Rule: Must describe ALL four situational categories with their unique psychological burdens AND link to universal etiological mechanisms. High-Yield Focus: Moral injury in combat, Helplessness in natural disasters, Betrayal in man-made disasters, Shattered security in interpersonal violence. Critical Note: Always connect situational triggers to underlying etiological frameworks (biological/psychological/socio-cultural) to demonstrate integrated understanding beyond simple listing.`},{id:`q-75`,segment:`THEME 3: ANXIETY, TRAUMA, STRESSOR-RELATED & OCD > Post-Traumatic Stress Disorder (PTSD)`,title:`Write short notes on: Clinical picture of children with PTSD`,years:`July 2021-Jan 2022 TMA Q18`,answer:[{type:`heading`,level:3,text:`Definition and Core Presentation`},{type:`paragraph`,text:`Post-Traumatic Stress Disorder in children presents uniquely due to developing cognitive, emotional, and linguistic capacities. Children often have greater difficulty verbally expressing pain, especially following physical or sexual abuse. Per DSM-5-TR, children aged ≤6 years have specific subtype criteria accounting for behavioral rather than purely verbal trauma expressions. Trauma interferes with critical developmental tasks and alters autonomic nervous system and personality organization.`},{type:`rule`},{type:`heading`,level:3,text:`Developmental and Symptomatic Manifestations`},{type:`paragraph`,text:`Clinical features span intrusive, avoidant, cognitive, and arousal domains, manifesting through observable behaviors and somatic complaints rather than explicit verbal flashbacks:`},{type:`table`,headers:[`Assessment Domain`,`Clinical Manifestations in Children`],rows:[[`Intrusive Re-experiencing`,`Post-traumatic play compulsively re-enacting themes without joy; frightening dreams lacking identifiable trauma content; severe distress to environmental reminders.`],[`Avoidance Behavior`,`Situational avoidance of people/places/games e
