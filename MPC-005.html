                        Can be more complex, time-consuming, expensive, and logistically challenging to implement and replicate.
                    
                    
                        Ethical Concerns
                        Generally easier to manage informed consent and debriefing.
                        Can raise more complex ethical issues, particularly if participants are unaware they are being studied, requiring careful consideration of consent and privacy.
                    
                
            
            In summary, lab experiments prioritize internal validity and control at the expense of realism, while field experiments prioritize external validity and ecological realism, often at the cost of some control over extraneous variables."}],"cue":"Key Concept: While both experimental research (typically referring to lab experiments) and field experiments are ...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q057","segment":"Additional Topics","title":"Simple Random Sampling 📝","years":"Jun 24","answer":[{"type":"paragraph","text":"Simple Random Sampling: A probability sampling method where every member of the population has an equal and independent chance of being selected for the sample. This method is considered the most basic and fundamental form of probability sampling, aiming to create a sample that is highly representative of the population, thereby minimizing sampling bias.
            
                Key Characteristics:
                    
                        Equal Chance: Each individual in the population has the same probability of being chosen.
                        Independent Selection: The selection of one individual does not influence the selection of any other individual.
                        Random Process: Selection is done purely by chance, typically using a random number generator or drawing names from a hat.
                        Requires a Sampling Frame: To implement simple random sampling, a complete and accurate list of every member of the target population (known as a sampling frame) is essential.
                    
                
                Procedure:
                    
                        Define the target population clearly.
                        Obtain or create a complete and accurate list of all individuals in the population (sampling frame).
                        Assign a unique number to each individual in the sampling frame.
                        Determine the desired sample size.
                        Use a random number generator (computer program, random number table) or a physical lottery method to select the specific numbers corresponding to the individuals who will be included in the sample.
                    
                
                Example: If you want to sample 100 students from a university with 10,000 students, you would get a list of all 10,000 students, assign each a number, and then use a random number generator to select 100 unique numbers. The students corresponding to those numbers would form your sample.
                Advantages:
                    
                        High Representativeness: If implemented correctly, it produces highly representative samples, reducing sampling bias.
                        Unbiased Estimates: Statistical estimates (e.g., means, proportions) derived from simple random samples are unbiased.
                        Statistical Generalizability: Allows for the confident generalization of findings from the sample to the population with quantifiable margins of error.
                        Foundation: Forms the basis for many other more complex probability sampling methods.
                    
                
                Disadvantages:
                    
                        Requires Complete List: Often impractical or impossible to obtain a complete and accurate sampling frame for very large or diverse populations.
                        Geographical Dispersion: Selected individuals might be widely dispersed, making data collection logistically challenging and expensive (e.g., if you need to conduct in-person interviews).
                        Inefficient for Subgroups: If the population contains small but important subgroups, simple random sampling might not include enough members of those subgroups for meaningful analysis. Other methods like stratified sampling would be better.
                    Chance of Unrepresentative Sample: Although unbiased, it's still possible by chance to draw a sample that is not perfectly representative, especially with smaller sample sizes."}],"cue":"Key Concept: **Simple Random Sampling:** A probability sampling method where every member of the population has a...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q059","segment":"Additional Topics","title":"Convergent Validity and Discriminant Validity 📝","years":"Jun 20","answer":[{"type":"paragraph","text":"Convergent validity and discriminant validity are two key aspects of construct validity, which is the degree to which a test or measure accurately assesses the specific psychological construct it is intended to measure. Together, they demonstrate that a measure is truly capturing the intended construct and not something else."},{"type":"heading","level":4,"text":"1. Convergent Validity:"},{"type":"paragraph","text":"Concept: The extent to which a measure is positively correlated with other measures that theoretically should be measuring the same or a very similar construct. If two different measures are supposed to be assessing the same thing, their scores should \"converge\" or show a strong positive relationship.
                Purpose: Provides evidence that your measure is indeed tapping into the construct it aims to measure by showing its agreement with other valid measures of that construct.
                Example: If you develop a new scale to measure \"anxiety,\" it should show a strong positive correlation with existing, well-established anxiety scales (e.g., Beck Anxiety Inventory, State-Trait Anxiety Inventory). Similarly, if your scale measures \"extraversion,\" it should correlate highly with behavioral observations of extraversion (e.g., frequency of social interactions).
                Analogy: Different roads leading to the same destination."},{"type":"heading","level":4,"text":"2. Discriminant Validity (Divergent Validity):"},{"type":"paragraph","text":"Concept: The extent to which a measure is *not* correlated (or is weakly correlated) with measures that theoretically should be measuring different, unrelated constructs. If your measure is truly specific to one construct, it should \"discriminate\" or diverge from measures of other distinct constructs.
                Purpose: Provides evidence that your measure is distinct from other constructs and is not accidentally measuring something else. It helps confirm that your measure is unique and specific to your intended construct.
                Example: If you develop a new scale to measure \"anxiety,\" it should show a low or no correlation with measures of theoretically unrelated constructs like \"intelligence\" or \"agreeableness.\" If it correlated highly with a measure of depression, it might suggest your anxiety scale isn't purely measuring anxiety but is perhaps confounded with depressive symptoms.
                Analogy: Roads leading to different destinations should not be confused."},{"type":"heading","level":4,"text":"Summary:"},{"type":"paragraph","text":"Convergent Validity: Your measure correlates highly with other measures of the *same* construct.
                Discriminant Validity: Your measure does *not* correlate highly with measures of *different* constructs.
            
            Both convergent and discriminant validity are essential for establishing robust construct validity. Researchers often use a Multi-Trait Multi-Method (MTMM) matrix to systematically assess these validities by measuring multiple traits using multiple methods."}],"cue":"Key Concept: Convergent validity and discriminant validity are two key aspects of **construct validity**, which i...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q060","segment":"Additional Topics","title":"Criteria for Selection of Case Study 📝","years":"Jun 20","answer":[{"type":"paragraph","text":"Case Study: An in-depth, intensive investigation of a single individual, group, organization, event, or community. It is a qualitative research method aimed at providing a holistic understanding of a complex phenomenon within its real-life context."},{"type":"heading","level":4,"text":"Criteria for the Selection of a Case Study:"},{"type":"paragraph","text":"Selecting the \"case\" is a crucial step in case study research, as it directly impacts the depth and insights gained. Unlike statistical sampling for generalizability, case selection is often purposive, aiming for specific knowledge.
            
                Relevance to the Research Question: This is the foremost criterion. The selected case must be able to provide rich, in-depth information directly related to the central research questions or phenomenon of interest.
                    
                        Example: If studying organizational change, choose an organization undergoing significant change.
                    
                
                Uniqueness or Rarity: The case might be chosen because it is an unusual, exceptional, or extreme example of a phenomenon. These \"outlier\" cases can provide profound insights that cannot be gained from typical cases.
                    
                        Example: A child prodigy, a rare neurological condition, or an organization that successfully defied industry norms.
                    
                
                Typicality/Representativeness (for some case studies): In some instances, a researcher might select a \"typical\" or \"average\" case to understand a common phenomenon in detail. This allows for transferability of findings to similar contexts, though not statistical generalizability.
                    
                        Example: An average classroom to study typical teacher-student interactions.
                    
                
                Access and Feasibility:
                    
                        Access: The researcher must be able to gain permission and access to the case (e.g., the individual, organization, or community). This involves negotiating entry and building rapport.
                        Feasibility: Consider practical constraints such as time, resources, geographical proximity, and the availability of data sources.
                    
                
                Information-Richness: The case should be able to provide diverse and rich data sources (e.g., interviews, documents, observations, historical records). A case that offers multiple avenues for data collection is preferred.
                Potential for Theoretical Insight/Replication:
                    
                        Theoretical Replication: Choosing cases that might confirm, extend, or challenge existing theories.
                        Literal Replication: Selecting cases that are predicted to produce similar results to a previous case (used in multiple-case studies).
                    
                
                Boundaries of the Case: The case must have clearly defined boundaries (e.g., a specific individual, a particular program, a defined period of time) to ensure the study remains focused and manageable.
                Stakeholder Cooperation: Especially for organizational or community case studies, the willingness and cooperation of key stakeholders and participants are vital for successful data collection.
                Longitudinal Potential (if applicable): If the research question involves processes or changes over time, a case that allows for longitudinal tracking of the phenomenon is beneficial.
            
            Ultimately, the selection of a case is a strategic decision guided by the research objectives and the desire to maximize the learning and understanding derived from the in-depth inquiry."}],"cue":"Key Concept: **Case Study:** An in-depth, intensive investigation of a single individual, group, organization, ev...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q061","segment":"Additional Topics","title":"Objectivity Safeguards in Research Process 📝","years":"Jun 23","answer":[{"type":"paragraph","text":"Objectivity in Research: Objectivity refers to the aim of conducting research in a way that is unbiased, neutral, and free from personal feelings, beliefs, or prejudices of the researcher. While complete objectivity, especially in social sciences, is a philosophical debate, researchers strive to minimize subjectivity and bias to ensure that findings accurately reflect the phenomena under investigation rather than the researcher's preconceptions."},{"type":"heading","level":4,"text":"Safeguards to Enhance Objectivity in the Research Process:"},{"type":"paragraph","text":"Researchers employ various strategies to promote objectivity and minimize bias across different stages of the research process:
            
                Rigorous Research Design:
                    
                        Randomization: In experimental designs, randomly assigning participants to experimental and control groups helps ensure that groups are equivalent at the outset, controlling for selection bias.
                        Control Groups: Including a control group allows for comparison and helps isolate the effect of the independent variable, ensuring that observed changes are due to the treatment and not other factors.
                        Standardized Procedures: Developing clear, detailed, and consistent protocols for data collection, intervention delivery, and measurement ensures that all participants are treated similarly, reducing inconsistencies.
                    
                
                Blinding (Masking):
                    
                        Single-Blind: Participants are unaware of which treatment condition they are in (e.g., active drug or placebo). This controls for participant expectations (placebo effect).
                        Double-Blind: Both participants and the researchers administering the treatment or collecting data are unaware of group assignments. This controls for both participant and experimenter biases (e.g., experimenter expectancy effects, subtle cues).
                        Triple-Blind: In addition to participants and researchers, the data analysts are also unaware of group assignments.
                    
                
                Operational Definitions:
                    
                        Clearly defining abstract concepts (constructs) in terms of observable and measurable procedures. This reduces ambiguity and allows for consistent measurement.
                    
                
                Multiple Observers/Raters (Inter-Rater Reliability):
                    
                        When data involves subjective judgments or observations, using two or more independent observers/raters to code or evaluate the same data. High agreement among raters indicates greater objectivity.
                        Thorough training of observers to ensure consistent application of coding schemes.
                    
                
                Triangulation:
                    
                        Using multiple sources of data, methods, or theories to investigate the same phenomenon. This helps cross-verify findings and gain a more comprehensive, less biased understanding.
                        Example: Collecting data through interviews, observations, and documents to study a single phenomenon.
                    
                
                Pilot Testing:
                    
                        Conducting a small-scale preliminary study to test the research design, instruments, and procedures. This helps identify and refine potential sources of bias or errors before the main study.
                    
                
                Peer Review:
                    
                        Submitting research proposals, methodologies, and findings for scrutiny by independent experts in the field. Peer review helps identify methodological flaws, biases, and unstated assumptions.
                    
                
                Reflexivity (in qualitative research):
                    
                        Actively reflecting on and acknowledging the researcher's own position, assumptions, experiences, and potential biases. While not eliminating bias, it makes the subjective elements transparent and allows for critical self-awareness.
                    
                
                Use of Established Measures:
                    
                        Utilizing validated and reliable instruments that have been empirically shown to measure constructs consistently and accurately, reducing measurement bias.
                    
                
                Transparency and Open Science Practices:
                    
                        Pre-registering studies, sharing data and analysis code, and clearly reporting all methods and findings (including null results) enhance transparency and allow for independent verification, counteracting publication bias and questionable research practices."}],"cue":"Key Concept: **Objectivity in Research:** Objectivity refers to the aim of conducting research in a way that is u...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q062","segment":"Additional Topics","title":"Steps for Conducting a Case Study 📝","years":"Jun 15, Jun 23","answer":[{"type":"paragraph","text":"Case Study: An in-depth, intensive investigation of a single \"case\" (e.g., an individual, a group, an organization, an event, a program) within its real-life context. The goal is to provide a rich, detailed, and holistic understanding of a complex phenomenon."},{"type":"heading","level":4,"text":"Steps for Conducting a Case Study:"},{"type":"paragraph","text":"Define the Research Questions and Objectives:
                    
                        Clearly articulate what you want to understand about the case. Case study research often uses \"how\" or \"why\" questions to explore processes and contexts.
                        Determine if a case study is the most appropriate method for your research goals (i.e., when you need deep understanding of a contemporary phenomenon within its real-world context).
                    
                
                Select the Case(s):
                    
                        Choose a single case or multiple cases based on their relevance to the research question, uniqueness, typicality, or potential for theoretical insight. Purposive sampling is common.
                        Define the boundaries of the case (e.g., time period, specific individuals, organizational unit).
                    
                
                Develop the Research Design/Theoretical Framework:
                    
                        Identify the theoretical propositions that will guide your data collection and analysis. While inductive, having initial ideas helps focus the inquiry.
                        Determine the type of case study (e.g., explanatory, exploratory, descriptive, intrinsic, instrumental, collective).
                        Outline the specific data collection methods to be used.
                    
                
                Prepare for Data Collection:
                    
                        Gain Access: Obtain necessary permissions from gatekeepers and informed consent from participants. Establish rapport.
                        Develop Instruments: Create interview protocols, observation guides, or document analysis checklists.
                        Pilot Study: Conduct a small-scale pilot to refine instruments and procedures.
                        Ethical Considerations: Ensure participant anonymity, confidentiality, and minimize harm.
                    
                
                Collect Data: Case studies are characterized by the use of multiple data sources (triangulation) to provide a comprehensive understanding.
                    
                        Interviews: In-depth, semi-structured, or unstructured interviews with key informants and participants.
                        Observations: Direct observation of behaviors, interactions, and settings.
                        Documents and Artifacts: Analysis of reports, records, letters, emails, photos, videos, physical objects, etc.
                        Archival Records: Historical data, service records.
                        Field Notes: Detailed, systematic notes on observations, conversations, and reflections.
                    
                
                Analyze Data (Iterative Process):
                    
                        Data analysis begins early and is ongoing, often concurrently with data collection.
                        Coding: Break down raw data into manageable segments and assign codes (labels) to identify patterns, themes, and categories.
                        Pattern Matching: Compare empirically observed patterns with theoretically predicted patterns.
                        Explanation Building: Develop an explanation for the case, often iteratively refining it as more data is collected.
                        Cross-Case Synthesis (for multiple case studies): Look for similarities and differences across cases to generalize or build theory.
                        Use of Software: Qualitative data analysis software (e.g., NVivo, ATLAS.ti) can assist in managing and coding data.
                    
                
                Develop Findings and Report the Case Study:
                    
                        Narrative Construction: Present the findings as a coherent, rich, and detailed narrative, describing the case and the emerging themes.
                        Thick Description: Provide enough contextual detail for readers to understand the case fully and assess transferability.
                        Integrate Evidence: Support interpretations with evidence from various data sources (e.g., direct quotes, observational notes, document excerpts).
                        Discussion: Relate findings back to research questions, literature, and theoretical propositions. Discuss limitations and implications.
                        Ethical Reporting: Maintain anonymity and confidentiality.
                    
                
            
            Case study research is a powerful approach for exploring complex, real-world phenomena in depth, providing nuanced insights that might be missed by other methods."}],"cue":"Key Concept: **Case Study:** An in-depth, intensive investigation of a single \"case\" (e...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q064","segment":"Additional Topics","title":"Issues of Reliability and Validity in Discourse Analysis 📝","years":"Jun 19","answer":[{"type":"paragraph","text":"Discourse Analysis (DA) is a qualitative research approach that emphasizes interpretation and the social construction of meaning through language. As such, the traditional quantitative notions of reliability (consistency) and validity (accuracy) need to be re-conceptualized or adapted to fit the epistemological assumptions of DA. Instead of \"reliability\" and \"validity,\" terms like \"trustworthiness,\" \"credibility,\" \"transferability,\" \"dependability,\" and \"confirmability\" are often used."},{"type":"heading","level":4,"text":"Issues of Reliability in Discourse Analysis:"},{"type":"paragraph","text":"Traditional reliability measures (e.g., test-retest, inter-rater correlation) are often not directly applicable or meaningful in DA due to its interpretive nature.
            
                Inter-Rater Reliability:
                    
                        Issue: DA often involves subjective interpretation of text/discourse. Different analysts might interpret the same linguistic features or conversational turns differently based on their theoretical lens or focus. Achieving high inter-rater agreement (e.g., using Kappa coefficients) can be challenging and might even be seen as inappropriate, as it can force a superficial consensus rather than acknowledging nuanced interpretations.
                        Mitigation: Instead of aiming for perfect agreement, focus on:
                            
                                Researcher as Instrument: Acknowledge the researcher's role in interpretation.
                                Clear Coding Procedures: Develop transparent and clearly defined coding schemes/analytical frameworks.
                                Peer Debriefing: Discuss interpretations with fellow researchers to challenge assumptions and refine analysis.
                                Audit Trail: Maintain meticulous records of decisions made during analysis.
                                Reflexivity: Explicitly discuss the researcher's background and how it might influence interpretations.
                            
                        
                    
                
                Intra-Rater Reliability:
                    
                        Issue: The consistency of one researcher's interpretations over time. As a researcher gains more insight or their theoretical understanding evolves, their interpretations might shift.
                        Mitigation: Re-examining earlier analyses, detailed documentation of the analytical process.
                    
                
                Reproducibility:
                    
                        Issue: Given the highly contextual and interpretive nature, it's virtually impossible to \"reproduce\" a DA study and expect identical findings, as the research process is deeply intertwined with the researcher's interaction with the data.
                        Mitigation: Focus on transparency of methods and reasoning rather than exact replication of results."},{"type":"heading","level":4,"text":"Issues of Validity in Discourse Analysis:"},{"type":"paragraph","text":"Traditional validity (e.g., internal, external validity as in quantitative research) is also adapted or replaced by concepts of trustworthiness.
            
                Credibility (Internal Validity Equivalent):
                    
                        Issue: How accurately do the findings represent the reality or perspective of the participants/discourse being studied? Is the interpretation a plausible and faithful representation?
                        Mitigation:
                            
                                Triangulation: Using multiple data sources (e.g., different types of discourse, different contexts) or analytical perspectives.
                                Member Checking/Respondent Validation: Presenting analyses back to participants (if applicable) to get their feedback on the accuracy of interpretations. This can be complex in DA if participants are not directly interviewed.
                                Prolonged Engagement: Spending sufficient time with the data to gain deep understanding and overcome superficial interpretations.
                                Rich, Thick Description: Providing enough contextual detail for the reader to evaluate the plausibility of the interpretations.
                            
                        
                    
                
                Transferability (External Validity Equivalent):
                    
                        Issue: To what extent can the findings be applied or transferred to other contexts or populations? DA is deeply contextual, so universal generalizations are not the aim.
                        Mitigation: Provide rich, detailed descriptions of the research context and the discourse analyzed (\"thick description\"). This allows readers to judge if the findings are relevant to their own contexts.
                    
                
                Confirmability (Objectivity Equivalent):
                    
                        Issue: Are the findings based on the data and not solely on the researcher's biases or preferences? Is there a logical connection between the data and the interpretations?
                        Mitigation:
                            
                                Audit Trail: Maintaining a transparent record of all research decisions, data points, analytical steps, and theoretical memos.
                                Reflexivity: Acknowledging and reflecting on one's own assumptions and biases throughout the research process.
                            
                        
                    
                
                Dependability (Reliability Equivalent):
                    
                        Issue: The consistency of the findings over time and across similar conditions. Would the findings be consistent if the study were repeated with the same (or similar) participants in the same (or similar) context?
                        Mitigation: Audit trail, detailed methodological description, peer debriefing.
                    
                
            
            In summary, while DA does not adhere to quantitative reliability and validity measures, it has developed its own robust criteria for ensuring the rigor and trustworthiness of its findings, emphasizing transparency, reflexivity, and deep engagement with the data."}],"cue":"Key Concept: Discourse Analysis (DA) is a qualitative research approach that emphasizes interpretation and the so...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q065","segment":"Additional Topics","title":"Types of Survey Research 📝","years":"Jun 17","answer":[{"type":"paragraph","text":"Survey Research: A quantitative research method used to collect data from a sample of individuals (or units) from a population, typically through questionnaires or interviews. It aims to describe characteristics of a population, identify relationships between variables, or understand attitudes, opinions, and behaviors."},{"type":"heading","level":4,"text":"Types of Survey Research:"},{"type":"heading","level":4,"text":"Survey research can be categorized in several ways, primarily by the method of data collection and by the time dimension:"},{"type":"heading","level":4,"text":"A. Based on Method of Data Collection:"},{"type":"paragraph","text":"Questionnaire Surveys:
                    
                        Definition: Involves a set of written questions that respondents answer themselves.
                        Types:
                            
                                Mail Surveys: Questionnaires sent and returned via postal mail.
                                    
                                        Pros: Wide reach, low cost (per respondent), anonymity.
                                        Cons: Low response rates, no clarification possible, time-consuming.
                                    
                                
                                Online/Web Surveys: Administered via the internet using platforms like Google Forms, SurveyMonkey, Qualtrics.
                                    
                                        Pros: Very low cost, fast data collection, wide reach, automated data entry, can include multimedia.
                                        Cons: Digital divide issues, potential for self-selection bias, no rapport building, security/privacy concerns.
                                    
                                
                                In-App/Kiosk Surveys: Surveys embedded within applications or presented on dedicated kiosks (e.g., in stores, airports).
                            
                        
                    
                
                Interview Surveys:
                    
                        Definition: Involves a researcher (interviewer) directly asking questions to respondents and recording their answers. Can be structured (fixed questions, response options) or semi-structured/unstructured (more open-ended).
                        Types:
                            
                                Face-to-Face (In-person) Interviews: Conducted directly with the respondent.
                                    
                                        Pros: High response rates, allows for rapport building, clarification of questions, observation of non-verbal cues, suitable for complex questions.
                                        Cons: Very expensive, time-consuming, interviewer bias potential, limited geographical reach.
                                    
                                
                                Telephone Interviews: Conducted over the phone.
                                    
                                        Pros: Wider geographical reach than face-to-face, faster than mail, some clarification possible.
                                        Cons: Lower response rates than in-person, limited duration, difficulty with complex questions, no non-verbal cues."},{"type":"heading","level":4,"text":"B. Based on Time Dimension:"},{"type":"paragraph","text":"Cross-Sectional Surveys:
                    
                        Definition: Data is collected from a sample at a single point in time. It provides a snapshot of the population's characteristics, attitudes, or behaviors at that specific moment.
                        Use: Descriptive studies, exploring relationships between variables at one point in time.
                        Pros: Quick, relatively inexpensive.
                        Cons: Cannot establish cause-and-effect relationships (only associations), cannot track changes over time.
                        Example: A survey of public opinion on a political issue conducted in a specific week.
                    
                
                Longitudinal Surveys:
                    
                        Definition: Data is collected from the same sample or different samples from the same population at multiple points in time. This allows researchers to track changes, identify trends, and explore cause-and-effect relationships over time.
                        Types:
                            
                                Trend Studies: Different samples from the same population are surveyed at different times (e.g., surveying college freshmen about their career aspirations every 5 years).
                                Cohort Studies: Different samples from a specific subgroup (cohort) are surveyed at different times (e.g., tracking attitudes of individuals born in the 1980s at different life stages).
                                Panel Studies: The *exact same* individuals are surveyed at multiple points in time.
                                    
                                        Pros: Best for identifying individual-level change and cause-and-effect over time.
                                        Cons: High attrition (participants dropping out), expensive, participant conditioning (repeated exposure to survey).
                                    
                                
                            
                        
                        Use: Studying development, policy changes, long-term effects.
                    
                
            
            The choice of survey type depends on the research question, available resources, and the desired level of depth vs. breadth."}],"cue":"Key Concept: **Survey Research:** A quantitative research method used to collect data from a sample of individual...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q066","segment":"Additional Topics","title":"Types of Hypothesis 📝","years":"Dec 17","answer":[{"type":"paragraph","text":"Hypothesis: A testable statement about the relationship between two or more variables, or a specific prediction about what will happen in a study. It is an educated guess or a proposed explanation that is subjected to empirical testing."},{"type":"heading","level":4,"text":"Types of Hypothesis:"},{"type":"paragraph","text":"Null Hypothesis (H₀):
                    
                        Concept: States that there is no significant relationship between the variables being studied, or that there is no significant difference between groups. It represents the default position or the status quo. Researchers typically try to find evidence to reject the null hypothesis.
                        Example: \"There is no significant difference in test scores between students who received tutoring and those who did not.\" (Symbolically: µ₁ = µ₂)
                    
                
                Alternative Hypothesis (H₁ or Hₐ):
                    
                        Concept: States that there is a significant relationship or difference between the variables. This is the research hypothesis – what the researcher actually expects to find or is trying to demonstrate. It is accepted if the null hypothesis is rejected.
                        Types of Alternative Hypothesis:
                            
                                Directional Hypothesis (One-tailed): Predicts the specific direction of the relationship or difference. It implies a specific outcome.
                                    
                                        Example: \"Students who received tutoring will score *higher* on the test than those who did not.\" (Symbolically: µ₁ > µ₂)
                                        Example: \"There will be a *negative* relationship between stress and job performance.\"
                                    
                                
                                Non-directional Hypothesis (Two-tailed): Predicts that there will be a relationship or difference, but does not specify the direction. It indicates that an effect exists, but not whether it will be an increase or decrease.
                                    
                                        Example: \"There will be a significant *difference* in test scores between students who received tutoring and those who did not.\" (Symbolically: µ₁ ≠ µ₂)
                                        Example: \"There will be a significant *relationship* between stress and job performance.\"
                                    
                                
                            
                        
                    
                
            
            Beyond these primary types, hypotheses can also be categorized by their complexity:
            
                Simple Hypothesis: Predicts a relationship between two variables (one independent, one dependent).
                    
                        Example: \"Smoking leads to lung cancer.\"
                    
                
                Complex Hypothesis: Predicts a relationship between three or more variables (e.g., two independent and one dependent, or one independent and two dependent variables, or multiple independent and multiple dependent variables).
                    
                        Example: \"Both smoking and poor diet increase the risk of heart disease and diabetes.\""}],"cue":"Key Concept: **Hypothesis:** A testable statement about the relationship between two or more variables, or a spec...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q067","segment":"Additional Topics","title":"Any Three Differences Between Experimental Research and Ex-post Facto Research 📝","years":"Dec 17","answer":[{"type":"paragraph","text":"Both experimental research and ex-post facto research aim to investigate relationships between variables, but they differ fundamentally in their ability to establish cause-and-effect and the level of control the researcher has over the independent variable."},{"type":"heading","level":4,"text":"Three Key Differences:"},{"type":"paragraph","text":"Manipulation of the Independent Variable (IV):
                    
                        Experimental Research: The researcher *actively manipulates* the independent variable. They create different levels or conditions of the IV and expose participants to them. This direct manipulation is essential for establishing causation.
                        Ex-Post Facto Research: The researcher *does not manipulate* the independent variable. The IV is a pre-existing characteristic or event that has already occurred naturally (e.g., gender, smoking status, having experienced a natural disaster). The researcher observes groups that already differ on this variable.
                    
                    Example: In experimental research, a researcher might *assign* different groups of people to receive different doses of a drug. In ex-post facto, a researcher would *compare* people who have already been taking different drug dosages in real life, without assigning them.
                
                Random Assignment of Participants:
                    
                        Experimental Research: Participants are *randomly assigned* to different conditions or groups. This is crucial for equating groups at the beginning of the study, minimizing pre-existing differences between groups and controlling for extraneous variables. This enhances internal validity.
                        Ex-Post Facto Research: *No random assignment* is possible because participants are selected based on their existing group membership or exposure to a past event. Since randomization is absent, groups may differ on other important characteristics (confounding variables) besides the IV, making it difficult to confidently infer causation.
                    
                    Example: In experimental research, randomly assigning students to a new teaching method vs. a traditional one. In ex-post facto, comparing students who chose to attend a specific tutoring program vs. those who didn't; the choice itself might reflect pre-existing differences in motivation or ability.
                
                Ability to Infer Causation (Internal Validity):
                    
                        Experimental Research: Due to manipulation of the IV, random assignment, and control over extraneous variables, experimental research has *high internal validity*. This means researchers can make strong cause-and-effect statements.
                        Ex-Post Facto Research: Has *lower internal validity* compared to experimental research. Because there is no random assignment and less control over confounders, researchers cannot definitively conclude that the pre-existing independent variable caused the observed differences in the dependent variable. Causal inferences are tentative and subject to alternative explanations.
                    
                    Example: An experiment can confidently say a new drug *caused* a reduction in symptoms. An ex-post facto study might find a relationship between living near a power plant and certain health issues, but cannot definitively say the power plant *caused* the issues due to many uncontrolled factors."}],"cue":"Key Concept: Both experimental research and ex-post facto research aim to investigate relationships between varia...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q068","segment":"Additional Topics","title":"Any Three Differences Between Qualitative and Quantitative Research Design 📝","years":"Dec 17","answer":[{"type":"paragraph","text":"Qualitative and quantitative research designs represent two fundamental paradigms in research, differing in their philosophical assumptions, objectives, methods, and types of data generated."},{"type":"heading","level":4,"text":"Three Key Differences Between Qualitative and Quantitative Research Design:"},{"type":"paragraph","text":"Research Purpose and Objectives:
                    
                        Qualitative Research: Aims to explore, understand, and interpret complex phenomena, experiences, meanings, and perspectives in depth. It focuses on \"how\" and \"why\" questions, often leading to theory generation or rich description. It seeks deep insights into subjective realities.
                        Quantitative Research: Aims to measure, test hypotheses, quantify relationships, predict outcomes, and generalize findings from a sample to a larger population. It focuses on \"what,\" \"how much,\" and \"how many\" questions, often leading to theory testing and statistical inference. It seeks objective, measurable data.
                    
                    Example: To understand the *experience* of anxiety among students (qualitative) vs. to measure the *prevalence* of anxiety among students and its correlation with academic performance (quantitative).
                
                Data Collection and Analysis Methods:
                    
                        Qualitative Research:
                            
                                Data Collection: Employs methods like in-depth interviews, focus groups, observations, case studies, and content analysis of textual data. Data is typically non-numerical (e.g., words, narratives, images).
                                Data Analysis: Involves iterative processes of coding, thematic analysis, discourse analysis, narrative analysis, and constant comparison to identify patterns, themes, and meanings. Analysis is interpretive and subjective, focusing on rich description.
                            
                        
                        Quantitative Research:
                            
                                Data Collection: Employs methods like surveys with structured questions, experiments, standardized tests, and analysis of existing numerical datasets. Data is typically numerical.
                                Data Analysis: Involves statistical methods (descriptive and inferential statistics) to analyze numerical data, test hypotheses, and make predictions. Analysis is objective and focuses on statistical significance and generalizability.
                            
                        
                    
                    Example: Conducting individual interviews and analyzing transcripts for themes (qualitative) vs. administering a Likert-scale questionnaire and performing statistical tests like t-tests or correlations (quantitative).
                
                Researcher's Role and Relationship with Participants/Data:
                    
                        Qualitative Research:
                            
                                Researcher's Role: The researcher is often an active participant in the data collection process (e.g., interviewer, observer) and is seen as the primary instrument for data collection and interpretation. Personal bias is acknowledged through reflexivity.
                                Relationship: Often involves building rapport and trust with participants to gain deep insights. The relationship can be close and prolonged.
                            
                        
                        Quantitative Research:
                            
                                Researcher's Role: The researcher strives for objectivity and distance, acting as an impartial observer or data collector. Standardized instruments are the primary tools, not the researcher's interpretation.
                                Relationship: Typically more detached and formal. Participants are often viewed as sources of numerical data, and anonymity is often emphasized.
                            
                        
                    
                    Example: An ethnographer immersing themselves in a community for months (qualitative) vs. a survey researcher distributing an online questionnaire to thousands of respondents (quantitative)."}],"cue":"Key Concept: Qualitative and quantitative research designs represent two fundamental paradigms in research, diffe...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q069","segment":"Additional Topics","title":"Simple Random Sampling: Discuss its advantages and disadvantages. 📝","years":"Jun 24","answer":[{"type":"paragraph","text":"Simple Random Sampling: A probability sampling method where every member of the population has an equal and independent chance of being selected for the sample. This method aims to create a sample that is highly representative of the population, thereby minimizing sampling bias."},{"type":"heading","level":4,"text":"Advantages of Simple Random Sampling:"},{"type":"paragraph","text":"High Representativeness: If implemented correctly, it tends to produce samples that are highly representative of the population, reducing sampling bias and increasing the external validity of findings.
                Unbiased Estimates: Statistical estimates (e.g., means, proportions) derived from simple random samples are generally unbiased.
                Statistical Generalizability: Allows for the confident generalization of findings from the sample to the population with quantifiable margins of error. This is a cornerstone for inferential statistics.
                Simplicity in Concept: The underlying concept is straightforward and easy to understand.
                Foundation for Other Methods: It forms the basis for many other more complex probability sampling methods (e.g., stratified sampling, cluster sampling)."},{"type":"heading","level":4,"text":"Disadvantages of Simple Random Sampling:"},{"type":"paragraph","text":"Requires Complete List of Population (Sampling Frame): Often impractical or impossible to obtain a complete, accurate, and up-to-date list of every member of the target population, especially for very large or diverse populations.
                Geographical Dispersion: The selected individuals might be widely dispersed geographically, making data collection logistically challenging, time-consuming, and expensive (especially for in-person interviews or physical surveys).
                Inefficient for Subgroups: If the population contains small but important subgroups, simple random sampling might not include enough members of those subgroups for meaningful separate analysis, simply by chance. Other methods like stratified sampling would be more appropriate in such cases.
                Potential for Chance Error (Unrepresentative Sample): Although unbiased, it's still possible by pure chance to draw a sample that is not perfectly representative, especially with smaller sample sizes. This is due to random sampling error.
                Lack of Participant Engagement: Simply being selected doesn't guarantee participation, and non-response can introduce bias if non-respondents differ systematically from respondents."}],"cue":"Key Concept: **Simple Random Sampling:** A probability sampling method where every member of the population has a...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q071","segment":"Additional Topics","title":"Research Biases: Discuss types like selection bias, confirmation bias, and the impact of placebo bias. 📝","years":"Dec 18, Dec 22, Dec 23","answer":[{"type":"paragraph","text":"Research Biases: Biases in research are systematic errors that can occur at any stage of the research process (design, data collection, analysis, interpretation, or publication) that lead to inaccurate or misleading results. Unlike random error, bias causes results to consistently deviate in one direction from the true value, potentially distorting the findings and conclusions. Recognizing and minimizing bias is crucial for ensuring the validity and reliability of research."},{"type":"heading","level":4,"text":"Types of Research Biases:"},{"type":"paragraph","text":"Selection Bias:
                    
                        Definition: Occurs when the participants selected for a study are not representative of the target population, or when the groups being compared are not equivalent at the outset. This can happen due to non-random sampling methods or differential dropout rates.
                        Examples:
                            
                                Sampling Bias: Using a convenience sample (e.g., surveying only students at a particular time of day) that does not accurately reflect the broader student population.
                                Volunteer Bias: Participants who volunteer for studies may differ systematically (e.g., more motivated, healthier) from those who don't.
                                Attrition Bias (Mortality Bias): If participants drop out of a study differentially between groups (e.g., sicker patients dropping out of a placebo group more often), the remaining groups become non-equivalent.
                            
                        
                        Impact: Can lead to inaccurate generalizations about the population or spurious differences between groups.
                    
                
                Confirmation Bias:
                    
                        Definition: The tendency for researchers (or individuals in general) to search for, interpret, favor, and recall information in a way that confirms their pre-existing beliefs, hypotheses, or expectations. It's a psychological phenomenon where people give more weight to evidence that supports what they already believe.
                        Examples:
                            
                                A researcher unconsciously designing a study or interpreting ambiguous data in a way that supports their favored theory.
                                Focusing only on data points that fit a pattern while ignoring contradictory evidence.
                            
                        
                        Impact: Can lead to flawed conclusions, impede scientific progress, and reduce the objectivity of research findings.
                        Mitigation: Peer review, blinding, pre-registration of studies, using standardized protocols, promoting a culture of questioning and critical self-reflection.
                    
                
                Placebo Bias (related to Placebo Effect):
                    
                        Definition: This refers to the systematic error introduced into research findings due to the \"placebo effect.\" The placebo effect is a genuine psychological or physiological therapeutic effect that occurs when a patient receives an inert treatment (a placebo, such as a sugar pill or saline injection) but believes it to be an active treatment. The patient's expectation or belief in the treatment, rather than the intrinsic properties of the treatment itself, leads to an improvement in their condition.
                        Psychological Examples:
                            
                                A patient with depression reports feeling better after taking a sugar pill, simply because they believe it's an antidepressant.
                                A student performs better on a task after being given an \"enhancement\" drink (which is just water) because they expect it to boost their cognitive abilities.
                                Participants in a pain study report reduced pain after receiving a fake acupuncture treatment due to their belief in its efficacy.
                            
                        
                        Impact: If researchers don't account for the placebo effect, they might mistakenly attribute any observed improvements in the experimental group (receiving the real treatment) solely to the treatment's active ingredients, overestimating the true effectiveness of the intervention.
                        Mitigation:
                            
                                Placebo Control Group: Including a group that receives a placebo, allowing comparison with the active treatment group to isolate the specific effect of the intervention.
                                Blinding: Single-blind (participants unaware of treatment assignment) and especially double-blind studies (both participants and researchers unaware) are crucial to control for participant and experimenter expectations, respectively.
                            
                        
                    
                
                Other Notable Biases (briefly):
                    
                        Observer/Interviewer Bias: Researcher's expectations influence observations or data collection.
                        Response Bias: Participants providing inaccurate responses (e.g., social desirability bias, recall bias).
                        Publication Bias: Tendency for studies with positive/significant results to be published more.
                        Funding Bias: Research outcomes influenced by financial sponsors.
                    
                
            
            Overall Mitigation: A combination of careful research design (randomization, control groups), blinding, standardized protocols, multiple independent coders/observers, transparency, and peer review are essential to minimize the various forms of research bias."}],"cue":"Key Concept: **Research Biases:** Biases in research are systematic errors that can occur at any stage of the res...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q072","segment":"Additional Topics","title":"Snowball Sampling: Discuss its use cases, advantages, and disadvantages. 📝","years":"Jun 18","answer":[{"type":"paragraph","text":"Snowball Sampling (Chain-Referral Sampling): A non-probability sampling technique where existing study participants recruit future participants from among their acquaintances. It is particularly useful when researching hidden, stigmatized, or hard-to-reach populations, where a sampling frame (a list of all members of the population) is unavailable.
            
                Process:
                    
                        The researcher identifies one or a few initial participants (\"seeds\") who meet the study criteria.
                        These initial participants are asked to identify or refer other individuals known to them who also meet the study criteria and are willing to participate.
                        The process continues, with new participants referring more people, causing the sample to grow like a rolling snowball.
                    
                
                Example: A researcher studying individuals with a rare medical condition might start by contacting a few known patients and then ask them to recommend other patients they know. Similarly, to study illicit drug users or members of a specific subculture, snowball sampling would be appropriate."},{"type":"heading","level":4,"text":"Use Cases for Snowball Sampling:"},{"type":"paragraph","text":"Hidden/Hard-to-Reach Populations: When the target population is difficult to identify, access, or locate directly (e.g., undocumented immigrants, individuals with rare diseases, members of underground movements, homeless populations).
                Stigmatized Groups: When dealing with sensitive topics or populations that may be reluctant to identify themselves publicly due to stigma or fear (e.g., victims of abuse, individuals involved in illegal activities, people with stigmatized health conditions).
                Network-Based Communities: When the research focuses on communities or groups that are naturally connected through social networks (e.g., specific professional groups, hobby communities, online forums).
                Qualitative Research: Often used in qualitative studies where the goal is to gain in-depth insights from a specific type of individual rather than broad statistical generalization.
                Exploratory Research: In early stages of research where little is known about the population or phenomenon, snowball sampling can help map out the social network and identify potential participants."},{"type":"heading","level":4,"text":"Advantages of Snowball Sampling:"},{"type":"paragraph","text":"Access to Hidden Populations: Most effective method for reaching populations that are otherwise inaccessible or very difficult to identify.
                Cost-Effective and Efficient: Can be less expensive and time-consuming than trying to find participants through other means for niche groups, as recruitment leverages existing social networks.
                Builds Trust: Referrals from trusted sources can help build rapport and trust with new participants, especially in sensitive research areas."},{"type":"heading","level":4,"text":"Disadvantages of Snowball Sampling:"},{"type":"paragraph","text":"Sampling Bias: The primary drawback. Highly prone to sampling bias as participants are likely to refer others who are similar to themselves (e.g., in social networks, demographics, beliefs, behaviors). This leads to a homogeneous and unrepresentative sample.
                Limited Generalizability: Due to the non-random nature and inherent bias, findings from snowball samples cannot be generalized to the larger population with statistical confidence. Results are specific to the studied sample.
                Lack of Control: The researcher has limited control over who is included in the sample after the initial \"seeds\" are chosen.
                Ethical Concerns: Potential for privacy issues if participants feel pressured or uncomfortable referring contacts, or if referred individuals become known to the researcher without direct consent.
                Unknown Population Size: It's impossible to determine the true sampling error or the population size, which complicates statistical inference."}],"cue":"Key Concept: **Snowball Sampling (Chain-Referral Sampling):** A non-probability sampling technique where existing...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q073","segment":"Additional Topics","title":"Post Hoc Fallacy: Explain with examples. 📝","years":"Dec 18","answer":[{"type":"paragraph","text":"Post Hoc Ergo Propter Hoc Fallacy (Post Hoc Fallacy): This is a logical fallacy that translates from Latin as \"after this, therefore because of this.\" It incorrectly assumes that because one event (B) follows another event (A), the first event (A) must have caused the second event (B). It's a common error in reasoning, especially in observational studies, historical analyses, and everyday observations.
            The fallacy lies in confusing temporal sequence (A happened before B) with causation (A caused B). Just because two things happen in sequence does not mean one caused the other. There could be several reasons for this:
            
                Coincidence: The two events are unrelated, and their sequence is purely coincidental.
                Third Variable: An unmeasured third variable (C) might be the true cause of both A and B, creating a spurious correlation.
                Reverse Causality: B actually caused A, not the other way around."},{"type":"heading","level":4,"text":"Examples of Post Hoc Fallacy:"},{"type":"paragraph","text":"Superstition Example:
                    
                        Claim: \"Every time I wear my lucky socks, my favorite sports team wins. Therefore, my lucky socks cause my team to win.\"
                        Fallacy: The act of wearing socks (A) is followed by a win (B). However, the socks have no causal influence on the game's outcome; the wins are likely coincidental or due to the team's actual performance.
                    
                
                Public Policy Example:
                    
                        Claim: \"After the city implemented a new curfew for teenagers, the crime rate among youth dropped. Therefore, the new curfew caused the reduction in youth crime.\"
                        Fallacy: While the curfew (A) preceded the drop in crime (B), other factors might be responsible. For example, a new community policing initiative was also started, or a youth center opened, or unemployment rates among youth decreased. Without controlling for these other variables, claiming the curfew as the sole cause is a post hoc fallacy.
                    
                
                Health/Medical Example:
                    
                        Claim: \"I started taking a new herbal supplement, and a week later, my cold disappeared. This supplement cured my cold.\"
                        Fallacy: Most common colds naturally resolve within about a week regardless of treatment. The cold disappearing (B) *after* taking the supplement (A) does not mean the supplement *caused* the recovery. The recovery was likely due to the body's natural immune response over time.
                    
                
                Economic Example:
                    
                        Claim: \"The new CEO took over, and profits soared the next quarter. The CEO is a genius who single-handedly boosted profits.\"
                        Fallacy: The change in CEO (A) preceded the profit increase (B). However, the profit increase could be due to a previously launched successful product, a general economic upturn, a competitor's decline, or strategic decisions made before the new CEO's arrival.
                    
                
            
            Relevance in Research: Researchers must be vigilant against the post hoc fallacy, especially in correlational or causal-comparative studies where variables are not manipulated or randomly assigned. True experimental designs are specifically structured to minimize this fallacy by controlling for extraneous variables, using random assignment, and ensuring proper temporal precedence (the cause *precedes* the effect) to establish causality."}],"cue":"Key Concept: **Post Hoc Ergo Propter Hoc Fallacy (Post Hoc Fallacy):** This is a logical fallacy that translates ...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q074","segment":"Additional Topics","title":"Field Experiments 📝","years":"Dec 19","answer":[{"type":"paragraph","text":"Field Experiment: A type of true experiment that is conducted in a natural, real-world setting rather than a highly controlled laboratory environment. Like laboratory experiments, field experiments involve the researcher manipulating one or more independent variables and (ideally) randomly assigning participants to different conditions. However, unlike lab experiments, the researcher has less control over extraneous variables due to the naturalistic setting.
            
                Key Characteristics:
                    
                        Natural Setting: Takes place in the participants' everyday environment (e.g., schools, workplaces, public spaces, stores, hospitals).
                        Manipulation of Independent Variable: The researcher actively changes or introduces the independent variable.
                        Random Assignment: Participants are (ideally) randomly assigned to different experimental or control groups, or units are randomly assigned to treatments (e.g., different classrooms, different branches of a company).
                        Measures Dependent Variable: The outcome variable is measured after the manipulation.
                    
                
                Purpose: To investigate cause-and-effect relationships in a more ecologically valid setting, bridging the gap between highly controlled lab experiments and purely observational studies.
                Example:
                    
                        Education: A researcher randomly assigns different teaching methods to different classrooms in a school and measures student performance (DV).
                        Marketing: A grocery store randomly assigns different pricing strategies for a product to different stores or different weeks and measures sales volume.
                        Social Psychology: Researchers might stage a \"lost letter\" experiment in different neighborhoods to study prosocial behavior, varying a characteristic of the letter (IV) and observing its return rate (DV).
                        Public Health: Implementing a new health intervention (e.g., a specific type of health education campaign) in some communities (randomly selected) and comparing health outcomes to similar communities without the intervention.
                    
                
                Advantages:
                    
                        High Ecological Validity: Findings are more generalizable to real-world situations because behavior is observed in its natural context.
                        Reduced Demand Characteristics: Participants may be unaware they are in an experiment, leading to more natural and genuine behavior (less reactivity).
                        Study of Complex Social Phenomena: Allows investigation of issues that are impractical or unethical to bring into a lab (e.g., effects of large-scale interventions, public policy changes).
                    
                
                Disadvantages:
                    
                        Less Control: The natural environment introduces many uncontrolled extraneous variables that can influence the dependent variable, making it harder to isolate the effect of the independent variable and establish clear cause-and-effect (lower internal validity compared to lab experiments).
                        Difficult to Replicate: The unique characteristics of a natural setting make it challenging for other researchers to precisely replicate the study.
                        Ethical Concerns: Can raise more complex ethical issues, particularly regarding informed consent, privacy, and potential deception, as participants may not be fully aware they are being studied.
                        Practical Challenges: Can be more time-consuming, expensive, and logistically difficult to set up and manage, including gaining access, implementing random assignment, and collecting data in an uncontrolled environment."}],"cue":"Key Concept: **Field Experiment:** A type of true experiment that is conducted in a natural, real-world setting r...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q005","segment":"Attention & Perception","title":"Differentiate between qualitative and quantitative research. Elucidate the types of qualitative research. 📝","years":"Jun 24","answer":[{"type":"heading","level":4,"text":"Qualitative vs. Quantitative Research:"},{"type":"paragraph","text":"Qualitative and quantitative research are two fundamental approaches to conducting research, differing significantly in their objectives, data collection methods, and analytical techniques. Both aim to acquire knowledge but from distinct angles."},{"type":"paragraph","text":"Feature
                        Qualitative Research
                        Quantitative Research
                    
                
                
                    
                        Purpose/Objective
                        To explore and understand concepts, experiences, opinions, and underlying reasons. Aims for in-depth understanding.
                        To test hypotheses, measure variables, establish relationships, and generalize findings from a sample to a larger population. Aims for objective measurement.
                    
                    
                        Nature of Data
                        Non-numerical; textual or visual (e.g., interview transcripts, field notes, observations, open-ended survey responses, images).
                        Numerical; quantifiable data (e.g., survey responses on scales, experimental results, statistics).
                    
                    
                        Approach
                        Exploratory, interpretive, subjective, contextual, inductive (theory-generating).
                        Confirmatory, statistical, objective, controlled, deductive (theory-testing).
                    
                    
                        Sample Size
                        Typically small and purposefully selected (non-random). Focus on richness of data, not statistical generalizability.
                        Typically large and randomly selected. Focus on statistical representativeness and generalizability.
                    
                    
                        Data Collection Methods
                        Interviews (in-depth, semi-structured), focus groups, observations (participant/non-participant), case studies, ethnography, content analysis of texts.
                        Surveys/questionnaires (closed-ended), experiments, statistical analysis of existing datasets.
                    
                    
                        Data Analysis
                        Identifying themes, patterns, categories, interpreting meanings (e.g., thematic analysis, discourse analysis).
                        Statistical methods (e.g., descriptive statistics, inferential statistics, regression analysis)."},{"type":"heading","level":4,"text":"Types of Qualitative Research:"},{"type":"paragraph","text":"Qualitative research encompasses various distinct methodologies, each suited for exploring specific aspects of human experience and social phenomena:
            
                1. Ethnography:
                    Involves deep immersion into a particular cultural group or community to understand their practices, beliefs, and social interactions from an insider's perspective. Data collection includes participant observation and interviews.
                    Example: A researcher living with and studying a remote tribal community to understand their daily rituals.
                
                2. Case Study:
                    An in-depth investigation of a single \"case\" (an individual, group, organization, event, or phenomenon) within its real-life context. It aims to provide a holistic understanding of the complexities of the case.
                    Example: A detailed study of a specific company's successful marketing campaign.
                
                3. Grounded Theory:
                    A systematic methodology that aims to construct theories directly from data collected and analyzed in the field. It is an inductive approach where theory emerges from constant comparison of data, rather than being hypothesized beforehand.
                    Example: Developing a theory about how cancer patients cope with their illness based on interviews with patients.
                
                4. Phenomenology:
                    Focuses on understanding the lived experiences and perceptions of individuals regarding a particular phenomenon. It seeks to explore what it means to experience something from the perspective of those who have lived it.
                    Example: Exploring the lived experience of nurses working in intensive care units during a pandemic.
                
                5. Narrative Research:
                    Explores how individuals make sense of their lives by focusing on their stories or narratives. Researchers collect and analyze accounts of personal experiences, often focusing on chronology and meaning-making.
                    Example: Analyzing the life stories of immigrant entrepreneurs to understand their journey of business establishment.
                
                6. Discourse Analysis:
                    Examines how language (written, spoken, or signed) is used in specific social contexts to construct meaning, create power relations, and shape social reality. It looks beyond individual words to the broader social function of language.
                    Example: Analyzing political speeches to understand how certain ideologies are conveyed and reinforced."}],"cue":"Key Concept: Qualitative vs...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-005-Q035","segment":"Attention & Perception","title":"Types of Survey Research Questions: Discuss Likert scale, dichotomous, ranking, and checklist questions. 📝","years":"Jun 16, Jun 18, Dec 19, Jun 20","answer":[{"type":"paragraph","text":"Survey research relies heavily on well-constructed questions to gather accurate and meaningful data. The type of question chosen depends on the nature of the information required, the construct being measured, and the desired level of detail. Different question types elicit different forms of responses and are suitable for varying analytical approaches."},{"type":"heading","level":4,"text":"Types of Survey Research Questions:"},{"type":"heading","level":4,"text":"1. Likert Scale Questions:"},{"type":"paragraph","text":"Definition: A psychometric scale commonly used in surveys to measure attitudes, opinions, or perceptions. Respondents indicate their level of agreement or disagreement with a statement along a symmetric agree-disagree scale.
                Format: Typically an odd number of response options (e.g., 5 or 7 points) to allow for a neutral midpoint. Common scales include:
                    
                        Strongly Disagree / Disagree / Neither Agree nor Disagree / Agree / Strongly Agree
                        Never / Rarely / Sometimes / Often / Always
                        Very Dissatisfied / Dissatisfied / Neutral / Satisfied / Very Satisfied
                    
                
                Usage: Ideal for measuring the strength of attitudes or opinions. Each statement (item) contributes to a summated score for a specific construct.
                Example:
                    \"I find the customer service at this company to be highly responsive.\""},{"type":"paragraph","text":"Strongly Disagree | Disagree | Neutral | Agree | Strongly Agree
                
                Advantages: Provides nuanced data beyond simple yes/no; easy for respondents to understand and answer; allows for statistical analysis (e.g., means, standard deviations, correlations).
                Disadvantages: Can be subject to response biases (e.g., acquiescence bias where respondents tend to agree); neutral option might be overused; cultural variations in response styles."},{"type":"heading","level":4,"text":"2. Dichotomous Questions:"},{"type":"paragraph","text":"Definition: Questions that offer only two mutually exclusive response options. They force respondents to choose between two alternatives.
                Format: Yes/No, True/False, Male/Female, Agree/Disagree, Present/Absent.
                Usage: Suitable for factual information, screening questions, or when a clear binary choice is sufficient.
                Example:
                    \"Do you own a smartphone?\""},{"type":"heading","level":4,"text":"Yes | No
                    \"Are you currently employed?\""},{"type":"paragraph","text":"True | False
                
                Advantages: Simple to understand and answer; easy to tabulate and analyze; minimizes ambiguity in response.
