 refers to the average capacity of human short-term memory (STM). He famously suggested that STM can hold approximately 7 ± 2 items (i.e., between 5 and 9 items). This capacity refers to \"chunks\" of information, where a chunk is a meaningful unit that can be a single letter, a word, or even a short phrase. This concept highlights the limited nature of our immediate conscious memory and the importance of chunking for increasing its effective capacity."}],"cue":"Key Concept: \"Miller's Magic Number,\" proposed by George A...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q064","segment":"Memory Systems","title":"Hebbian Learning","years":"Jun 2019 (1)","answer":[{"type":"paragraph","text":"Hebbian learning, often summarized as \"neurons that fire together, wire together,\" is a fundamental principle in neuroscience and cognitive psychology explaining synaptic plasticity. Proposed by Donald Hebb in 1949, it states that when two neurons are repeatedly or persistently activated at the same time, the connection (synapse) between them strengthens. This strengthening of synaptic connections is thought to be the cellular basis of learning and memory formation. It implies that learning occurs through changes in the efficiency of communication between neurons."}],"cue":"Key Concept: Hebbian learning, often summarized as \"neurons that fire together, wire together,\" is a fundamental ...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q066","segment":"Memory Systems","title":"Cognitive Neuroscience","years":"Dec 2023 (1), Jun 2018 (1)","answer":[{"type":"paragraph","text":"Cognitive neuroscience is an interdisciplinary field that combines cognitive psychology and neuroscience to study the biological basis of mental processes. It investigates how brain structures and functions give rise to cognitive abilities such as memory, perception, language, attention, and problem-solving. Researchers in this field use various techniques like fMRI, EEG, and TMS to observe brain activity during cognitive tasks, aiming to bridge the gap between the mind and the brain and understand the neural mechanisms underlying human cognition."}],"cue":"Key Concept: Cognitive neuroscience is an interdisciplinary field that combines cognitive psychology and neurosci...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q069","segment":"Memory Systems","title":"Alzheimer’s Disease","years":"Jun 2020 (1)","answer":[{"type":"paragraph","text":"Alzheimer's Disease is a progressive neurodegenerative disorder that primarily affects memory, thinking, and behavior, eventually leading to severe cognitive decline and dementia. It is characterized by the accumulation of abnormal protein deposits in the brain: amyloid plaques (outside neurons) and neurofibrillary tangles (inside neurons), which disrupt neural communication and cause brain cell death. Early symptoms often include difficulty remembering recent events, followed by confusion, disorientation, and challenges with language and problem-solving. There is currently no cure, but treatments can temporarily slow the progression of symptoms."}],"cue":"Key Concept: Alzheimer's Disease is a progressive neurodegenerative disorder that primarily affects memory, think...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q028","segment":"Multiple Intelligences Theory","title":"Discuss Gardner’s theory of multiple intelligences and its implications.","years":"Dec 2021 (1), Jun 2016 (1)","answer":[{"type":"paragraph","text":"Howard Gardner's Theory of Multiple Intelligences (MI Theory), first proposed in his 1983 book \"Frames of Mind,\" revolutionized the traditional view of intelligence. Challenging the idea of a single, unitary \"g-factor\" (general intelligence) measured by IQ tests, Gardner argued that intelligence is not a single entity but a collection of distinct, independent intelligences. He initially identified seven (later expanded to nine) intelligences, each representing a different way of processing information and solving problems."},{"type":"paragraph","text":"Gardner's Criteria for an Intelligence:
                            Gardner established specific criteria for what constitutes a distinct intelligence:
                            
                                Potential for isolation by brain damage (evidence from neuropsychology).
                                Existence of savants, prodigies, and other exceptional individuals.
                                An identifiable core operation or set of operations.
                                A distinctive developmental history and a definable set of \"end-state\" performances.
                                An evolutionary history and evolutionary plausibility.
                                Support from psychometric findings.
                                Susceptibility to encoding in a symbol system."},{"type":"heading","level":4,"text":"The Nine Intelligences (originally seven, later expanded):"},{"type":"list","items":["1.  Linguistic Intelligence: The ability to use language effectively, both orally and in writing. (e.g., poets, writers, journalists, speakers)."]},{"type":"list","items":["2.  Logical-Mathematical Intelligence: The ability to reason logically, solve mathematical problems, and think scientifically. (e.g., mathematicians, scientists, logicians)."]},{"type":"list","items":["3.  Spatial Intelligence: The ability to perceive the visual-spatial world accurately and to manipulate mental images. (e.g., architects, navigators, artists, chess players)."]},{"type":"list","items":["4.  Bodily-Kinesthetic Intelligence: The ability to use one's body skillfully for expression or goal-directed activities. (e.g., dancers, athletes, surgeons, craftspeople)."]},{"type":"list","items":["5.  Musical Intelligence: The capacity to perceive, appreciate, and produce rhythm, pitch, and timbre. (e.g., musicians, composers, singers)."]},{"type":"list","items":["6.  Interpersonal Intelligence: The ability to understand and interact effectively with others, sensing their moods, intentions, and motivations. (e.g., therapists, teachers, politicians, salespeople)."]},{"type":"list","items":["7.  Intrapersonal Intelligence: The ability to understand oneself, including one's own emotions, motivations, and goals. (e.g., philosophers, spiritual leaders, individuals with deep self-awareness)."]},{"type":"list","items":["8.  Naturalistic Intelligence (added later): The ability to recognize, classify, and understand patterns in the natural world. (e.g., biologists, ecologists, farmers, naturalists)."]},{"type":"list","items":["9.  Existential Intelligence (proposed, debated): The capacity to ponder deep questions about life, death, and existence. (e.g., philosophers, theologians)."]},{"type":"paragraph","text":"Gardner emphasizes that these intelligences are relatively independent, meaning a person can be strong in one area (e.g., musical) but average or weak in another (e.g., mathematical). However, they often work together in complex real-world tasks."},{"type":"heading","level":4,"text":"Implications of Gardner's Theory:"},{"type":"heading","level":4,"text":"The MI theory has had profound implications, particularly in education:"},{"type":"list","items":["1.  Broader View of Human Potential: It challenges the narrow focus of traditional IQ tests and promotes a more inclusive view of intelligence, recognizing diverse talents and strengths. It suggests that everyone is \"smart\" in some way."]},{"type":"list","items":["2.  Personalized Education: It advocates for educational approaches that cater to individual learning styles and strengths. Instead of a \"one-size-fits-all\" curriculum, educators are encouraged to present material in multiple ways (e.g., visually, musically, kinesthetically) to engage different intelligences."]},{"type":"list","items":["3.  Assessment Beyond Standardized Tests: It promotes alternative assessment methods that go beyond paper-and-pencil tests, such as portfolios, performance-based tasks, and observations, to better capture an individual's diverse intelligences."]},{"type":"list","items":["4.  Empowerment and Self-Esteem: By highlighting multiple pathways to intelligence, the theory can boost students' self-esteem and motivation, as they can identify and develop their unique strengths."]},{"type":"list","items":["5.  Curriculum Development: It encourages educators to design curricula that incorporate activities appealing to various intelligences, making learning more engaging and accessible."]},{"type":"heading","level":4,"text":"Criticisms:"},{"type":"paragraph","text":"Despite its popularity, MI theory faces criticisms:
                            
                                Lack of Empirical Evidence: Critics argue that there is insufficient empirical evidence from psychometric studies to support the independence of these intelligences. Many studies show high correlations between them, suggesting an underlying general factor.
                                \"Intelligences\" vs. \"Talents/Skills\": Some argue that what Gardner calls \"intelligences\" are more accurately described as specific talents, abilities, or cognitive styles rather than distinct forms of intelligence.
                                Vagueness of Criteria: The criteria for defining an intelligence are sometimes seen as ambiguous or not rigorously applied.
                                Practical Application Challenges: While inspiring, fully implementing MI theory in classrooms can be challenging due to resource limitations and the difficulty of assessing all intelligences.
                            
                            Nonetheless, Gardner's theory has significantly influenced educational practices and broadened the discourse on human intelligence, encouraging a more holistic and inclusive understanding of individual capabilities."}],"cue":"Key Concept: Howard Gardner's Theory of Multiple Intelligences (MI Theory), first proposed in his 1983 book \"Fram...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q060","segment":"Multiple Intelligences Theory","title":"Bodily-Kinesthetic Intelligence","years":"Jun 2024 (1), Dec 2018 (1), Dec 2016 (1)","answer":[{"type":"paragraph","text":"Bodily-Kinesthetic Intelligence is one of the multiple intelligences proposed by Howard Gardner. It refers to the ability to use one's body skillfully for expressive or goal-directed purposes, and to manipulate objects with dexterity. Individuals strong in this intelligence are often good at physical activities, sports, dance, acting, and crafts. They learn best through doing and hands-on experiences. Examples include athletes, dancers, surgeons, and artisans."}],"cue":"Key Concept: Bodily-Kinesthetic Intelligence is one of the multiple intelligences proposed by Howard Gardner...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q061","segment":"Multiple Intelligences Theory","title":"Existential Intelligence","years":"Jun 2019 (1), Dec 2019 (1)","answer":[{"type":"paragraph","text":"Existential Intelligence is one of Howard Gardner's proposed multiple intelligences, though it is often considered a \"ninth\" or \"candidate\" intelligence. It refers to the capacity to ponder deep questions about human existence, such as the meaning of life, why we die, and how we got here. Individuals with high existential intelligence are sensitive to fundamental questions about life, death, and the universe. They are often philosophers, theologians, or spiritual leaders."}],"cue":"Key Concept: Existential Intelligence is one of Howard Gardner's proposed multiple intelligences, though it is of...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q018","segment":"Problem Solving","title":"Describe the stages and strategies of problem solving.","years":"Jun 2018 (1), Jun 2022 (1), Dec 2017 (1)","answer":[{"type":"paragraph","text":"Problem-solving is a cognitive process involving the discovery, analysis, and resolution of problems. It's the process of moving from an initial state (the problem) to a desired goal state when the path to that goal is not immediately obvious. While the exact stages can vary depending on the complexity of the problem, a general model includes:"},{"type":"heading","level":4,"text":"Stages of Problem Solving:"},{"type":"list","items":["1.  Problem Identification and Definition: The first step is recognizing that a problem exists and clearly defining it. This involves understanding the initial state, the desired goal state, and any constraints or obstacles. A well-defined problem is half-solved. For example, realizing \"I'm hungry\" (problem identification) and then defining it as \"I need to prepare a quick, healthy meal with ingredients I have\" (problem definition)."]},{"type":"list","items":["2.  Information Gathering: Once the problem is defined, relevant information is collected. This might involve recalling past experiences, consulting external resources (books, internet), or observing the environment. For the meal example, checking the refrigerator for available ingredients."]},{"type":"list","items":["3.  Generating Solutions/Alternatives: This stage involves brainstorming various possible solutions or strategies to bridge the gap between the current state and the goal state. This often requires divergent thinking. For the meal, thinking of pasta, sandwich, or salad."]},{"type":"list","items":["4.  Evaluating Solutions: The generated solutions are critically assessed based on criteria such as feasibility, effectiveness, cost, time, and potential side effects. For the meal, considering which option is quickest, healthiest, and uses available ingredients."]},{"type":"list","items":["5.  Selecting and Implementing a Solution: The most promising solution is chosen and put into action. This involves planning the steps and executing them. Deciding on a salad and starting to chop vegetables."]},{"type":"list","items":["6.  Monitoring and Verification: The effectiveness of the implemented solution is monitored. If the solution is successful, the problem is resolved. If not, the process may need to be revisited, perhaps by redefining the problem or generating new solutions. Tasting the salad and deciding if it needs more seasoning."]},{"type":"heading","level":4,"text":"Strategies of Problem Solving:"},{"type":"paragraph","text":"Problem-solving strategies, or heuristics, are mental shortcuts or rules of thumb that help simplify complex problems and guide the search for a solution. They don't guarantee a solution but increase the likelihood of finding one."},{"type":"list","items":["1.  Algorithms: A step-by-step procedure that guarantees a solution if followed correctly. While effective, algorithms can be time-consuming or impossible for complex, ill-defined problems (e.g., mathematical formulas, instruction manuals)."]},{"type":"list","items":["2.  Heuristics: Mental shortcuts or rules of thumb that simplify complex problems and speed up decision-making, though they don't guarantee a correct solution."]},{"type":"paragraph","text":"The choice of strategy depends on the nature of the problem, the available resources, and the individual's cognitive style. Effective problem-solvers often employ a combination of these strategies and adapt their approach as needed."}],"cue":"Key Concept: Problem-solving is a cognitive process involving the discovery, analysis, and resolution of problems...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q030","segment":"Problem Solving","title":"Explain the importance of cultural blocks in problem solving.","years":"Jun 2024 (1)","answer":[{"type":"paragraph","text":"Cultural blocks are significant impediments to effective problem-solving because they are deeply ingrained, often unconscious, and shape the very framework within which individuals perceive, define, and attempt to resolve problems. These blocks stem from the shared norms, values, beliefs, traditions, customs, and established ways of thinking prevalent within a particular society, group, or organization. Their importance lies in their pervasive influence on cognitive processes and behavioral responses related to problem-solving."},{"type":"heading","level":4,"text":"Here's why cultural blocks are important in problem-solving:"},{"type":"list","items":["1.  Limit Problem Definition: Cultural norms can dictate what is considered a \"problem\" and how it should be framed. Issues that are taboo or culturally sensitive might not even be acknowledged as problems, or they might be framed in a way that prevents effective solutions."]},{"type":"list","items":["2.  Restrict Solution Generation: Cultural biases can narrow the range of acceptable solutions. Ideas that deviate from established traditions or social hierarchies may be immediately dismissed, regardless of their potential effectiveness. Conformity pressure can lead to \"groupthink,\" where individuals suppress novel ideas to maintain harmony."]},{"type":"list","items":["3.  Influence Information Processing: Culture can influence how individuals perceive and interpret information, leading to selective attention or biased interpretations that reinforce existing beliefs rather than facilitate objective problem analysis."]},{"type":"list","items":["4.  Impact Risk-Taking and Experimentation: In cultures where failure is heavily penalized or publicly shamed, individuals may become risk-averse, opting for safe, conventional solutions rather than experimenting with potentially more effective but uncertain approaches. This stifles creativity and innovation."]},{"type":"list","items":["5.  Affect Collaboration and Communication: Cultural differences in communication styles (e.g., direct vs. indirect communication, high-context vs. low-context cultures) can create misunderstandings and hinder effective collaboration during group problem-solving."]},{"type":"list","items":["6.  Perpetuate Outdated Practices: A strong adherence to tradition can prevent the adoption of more efficient or effective practices, even when the environment changes and old solutions are no longer adequate."]},{"type":"paragraph","text":"Understanding cultural blocks is vital because they are often invisible to those within the culture, operating as unspoken rules that constrain thought and action. Overcoming them requires conscious effort, cultural awareness, promoting psychological safety, and fostering environments that value diverse perspectives and encourage challenging the status quo in a constructive manner. Ignoring cultural blocks can lead to ineffective solutions, resistance to change, and missed opportunities for innovation."}],"cue":"Key Concept: Cultural blocks are significant impediments to effective problem-solving because they are deeply ing...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q032","segment":"Problem Solving","title":"Describe the characteristics of difficult problems. Discuss models and methods for effective problem solving.","years":"Jun 2023 (1)","answer":[{"type":"paragraph","text":"Problems vary greatly in their complexity and difficulty. Understanding the characteristics of difficult problems is crucial for selecting appropriate problem-solving strategies."},{"type":"heading","level":4,"text":"Characteristics of Difficult Problems:"},{"type":"heading","level":4,"text":"Difficult problems often share several features that make their resolution challenging:"},{"type":"list","items":["1.  Ill-Defined (or Unstructured): Unlike well-defined problems (e.g., a math equation) where the initial state, goal state, and permissible operations are clear, ill-defined problems have ambiguous or incomplete information. The problem itself might not be clearly stated, the goal might be vague, or the methods to solve it are not obvious."]},{"type":"list","items":["2.  Complex (Large Problem Space): They involve many variables, elements, or interconnected components, leading to a vast \"problem space\" (the set of all possible states and paths to a solution). This makes it difficult to explore all possibilities."]},{"type":"list","items":["3.  Novelty/Lack of Prior Experience: The problem is entirely new or significantly different from anything encountered before. There are no ready-made solutions or established algorithms to apply. This often requires creative thinking."]},{"type":"list","items":["4.  Uncertainty/Incomplete Information: Key information needed for a solution might be missing, unreliable, or difficult to obtain. This introduces risk and makes decision-making challenging."]},{"type":"list","items":["5.  Dynamic Nature: The problem itself or its context may change while the problem-solver is working on it, requiring constant adaptation and re-evaluation."]},{"type":"list","items":["6.  Multiple Constraints/Conflicting Goals: The problem might have several constraints that must be satisfied simultaneously, or there might be multiple goals that conflict with each other, requiring trade-offs."]},{"type":"list","items":["7.  High Stakes: The consequences of failure are significant, leading to increased pressure and potential for cognitive biases."]},{"type":"heading","level":4,"text":"Models and Methods for Effective Problem Solving:"},{"type":"paragraph","text":"Effective problem-solving, especially for difficult problems, often relies on structured approaches and a combination of strategies."},{"type":"heading","level":4,"text":"Models of Problem Solving:"},{"type":"list","items":["1.  Information Processing Model (Newell & Simon):"]},{"type":"list","items":["2.  Gestalt Approach:"]},{"type":"heading","level":4,"text":"Methods/Strategies for Effective Problem Solving:"},{"type":"paragraph","text":"For difficult problems, relying solely on algorithms (step-by-step procedures that guarantee a solution) is often not feasible. Instead, heuristics are employed:"},{"type":"list","items":["1.  Define and Reframe the Problem: For ill-defined problems, spending significant time clearly defining the problem is crucial. This might involve breaking it down, asking \"why\" repeatedly (5 Whys), or rephrasing it in different ways to gain new perspectives."]},{"type":"list","items":["2.  Means-Ends Analysis: (As described in Information Processing Model) Continuously identify the gap between current and desired states and find actions to reduce that gap. This helps in breaking down complex problems into smaller, more manageable sub-problems."]},{"type":"list","items":["3.  Working Backward: Start from the desired goal state and determine the steps needed to reach the initial state. This is effective when the goal is clear but the starting point or path is not."]},{"type":"list","items":["4.  Analogy: Look for similar problems that have been solved in the past, even if they are from different domains. Identify the underlying structure of the past problem and map its solution to the current one."]},{"type":"list","items":["5.  Brainstorming: For generating solutions, especially for ill-defined problems, brainstorming (either individually or in groups) encourages generating a large quantity of ideas without initial judgment, fostering divergent thinking."]},{"type":"list","items":["6.  Incubation: Taking a break from a difficult problem can allow the unconscious mind to work on it, leading to a sudden insight or a fresh perspective upon returning."]},{"type":"list","items":["7.  Trial and Error (Systematic): For some problems, a systematic trial-and-error approach, where each attempt provides information to refine the next, can be effective, especially when the problem space is not excessively large."]},{"type":"list","items":["8.  Externalizing the Problem: Drawing diagrams, creating flowcharts, or building physical models can help visualize complex relationships and identify patterns or solutions that are not apparent mentally."]},{"type":"list","items":["9.  Collaboration and Diverse Perspectives: For complex, multi-faceted problems, engaging a diverse group of individuals with different backgrounds, expertise, and cognitive styles can lead to more robust and innovative solutions."]},{"type":"paragraph","text":"Effective problem-solving for difficult challenges involves a flexible and adaptive approach, often combining these strategies and being willing to iterate and learn from failures."}],"cue":"Key Concept: Problems vary greatly in their complexity and difficulty...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q039","segment":"Problem Solving","title":"Discuss the strategies of problem solving.","years":"Jun 2018 (1), Jun 2020 (1)","answer":[{"type":"paragraph","text":"Problem-solving involves finding a path from an initial state to a desired goal state when the solution is not immediately obvious. Various strategies can be employed, ranging from systematic and exhaustive approaches to more intuitive and experience-based methods."},{"type":"list","items":["1.  Algorithms:"]},{"type":"list","items":["2.  Heuristics:"]},{"type":"list","items":["3.  Brainstorming:"]},{"type":"list","items":["4.  Incubation:"]},{"type":"paragraph","text":"Effective problem-solving often involves a flexible approach, combining these strategies. For instance, one might start with heuristics to narrow down possibilities and then apply an algorithm for a specific sub-problem, or use incubation when faced with a mental block. The choice of strategy depends on the nature of the problem, available time, and individual cognitive strengths."}],"cue":"Key Concept: Problem-solving involves finding a path from an initial state to a desired goal state when the solut...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q040","segment":"Problem Solving","title":"Explain heuristics as a strategy of problem solving.","years":"Dec 2015 (1)","answer":[{"type":"paragraph","text":"Heuristics are mental shortcuts or \"rules of thumb\" that people use to solve problems and make decisions quickly and efficiently. Unlike algorithms, which guarantee a solution if one exists, heuristics do not guarantee correctness but provide a practical and often effective way to navigate complex or ambiguous situations. They reduce the cognitive load by limiting the number of possible solutions or actions to consider."},{"type":"paragraph","text":"Characteristics of Heuristics:
                            
                                Efficiency: They allow for rapid decision-making and problem-solving, especially under time constraints.
                                Approximation: They often lead to a satisfactory, though not necessarily optimal, solution.
                                Experience-Based: Many heuristics are developed through experience and learning, becoming intuitive strategies.
                                Risk of Bias/Error: While efficient, heuristics can sometimes lead to systematic errors or cognitive biases because they simplify complex information."},{"type":"heading","level":4,"text":"Common Types of Heuristics in Problem Solving:"},{"type":"list","items":["1.  Means-End Analysis:"]},{"type":"list","items":["2.  Working Backward:"]},{"type":"list","items":["3.  Analogy:"]},{"type":"list","items":["4.  Trial and Error:"]},{"type":"list","items":["5.  Insight:"]},{"type":"paragraph","text":"Heuristics are indispensable in everyday problem-solving, allowing individuals to navigate complex situations with limited information and cognitive resources. While they offer efficiency, understanding their potential for error is crucial for effective decision-making."}],"cue":"Key Concept: Heuristics are mental shortcuts or \"rules of thumb\" that people use to solve problems and make decis...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q041","segment":"Problem Solving","title":"Explain any three techniques of problem-solving.","years":"Jun 2020 (1), Jun 2024 (1)","answer":[{"type":"heading","level":4,"text":"Problem-solving involves cognitive processes aimed at overcoming obstacles to achieve a goal. Here are three common techniques:"},{"type":"list","items":["1.  Means-End Analysis:"]},{"type":"list","items":["2.  Analogy:"]},{"type":"list","items":["3.  Working Backward:"]},{"type":"paragraph","text":"These techniques illustrate how individuals strategically approach problems, either by breaking them down, drawing on past experiences, or reversing the typical flow of thought to find a solution."}],"cue":"Key Concept: Problem-solving involves cognitive processes aimed at overcoming obstacles to achieve a goal...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q049","segment":"Problem Solving","title":"Explain the significance of artificial intelligence in problem solving.","years":"Dec 2019 (1)","answer":[{"type":"paragraph","text":"Artificial Intelligence (AI) holds immense significance in problem-solving by offering capabilities that often surpass human limitations in terms of speed, scale, and complexity. AI-powered systems can analyze vast datasets, identify patterns, and generate solutions in ways that revolutionize various domains."},{"type":"list","items":["1.  Handling Big Data and Complexity: AI excels at processing and making sense of enormous volumes of data that would overwhelm human cognitive capacity. This is critical for problems in fields like finance, genomics, and climate modeling, where solutions depend on analyzing complex, high-dimensional data. AI algorithms can identify subtle correlations and anomalies that humans might miss."]},{"type":"list","items":["2.  Automation of Routine and Complex Tasks: AI can automate repetitive problem-solving tasks, freeing up human resources for more creative or strategic endeavors. This includes tasks like customer service (chatbots), data entry, and even complex diagnostic processes in medicine. Furthermore, AI can tackle problems requiring complex calculations or simulations that are impractical for humans."]},{"type":"list","items":["3.  Optimization and Efficiency: AI algorithms, particularly those based on optimization techniques (e.g., genetic algorithms, reinforcement learning), can find optimal or near-optimal solutions to complex logistical, scheduling, and resource allocation problems. This leads to significant efficiency gains in supply chain management, transportation, energy grids, and manufacturing."]},{"type":"list","items":["4.  Pattern Recognition and Prediction: Machine learning, a subset of AI, is exceptionally good at recognizing patterns in data and making predictions. This is crucial for problems involving forecasting (e.g., stock prices, weather), fraud detection, medical diagnosis, and predicting consumer behavior. By identifying underlying patterns, AI can anticipate problems and suggest preventative solutions."]},{"type":"list","items":["5.  Adaptability and Learning: Many AI systems are designed to learn and adapt over time. Through reinforcement learning, for example, AI agents can learn optimal strategies by trial and error in complex environments, improving their problem-solving capabilities without explicit programming for every scenario. This is evident in AI playing games like Chess or Go, where they learn to master strategies far beyond human intuition."]},{"type":"list","items":["6.  Support for Human Decision-Making: AI doesn't always replace human problem-solvers but often augments them. AI systems can act as intelligent assistants, providing insights, recommending solutions, and highlighting potential risks or opportunities, thereby enhancing human decision-making in critical areas like legal analysis, financial trading, and strategic planning."]},{"type":"list","items":["7.  Solving Previously Intractable Problems: AI has opened doors to solving problems that were once considered too complex or computationally intensive for traditional methods. Examples include drug discovery, protein folding (AlphaFold), and developing new materials."]},{"type":"paragraph","text":"In essence, AI's significance in problem-solving lies in its ability to process, learn from, and act upon data at scales and speeds impossible for humans, leading to more efficient, accurate, and innovative solutions across virtually every industry and scientific discipline."}],"cue":"Key Concept: Artificial Intelligence (AI) holds immense significance in problem-solving by offering capabilities ...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q068","segment":"Problem Solving","title":"Functional Fixedness","years":"Jun 2015 (1)","answer":[{"type":"paragraph","text":"Functional fixedness is a cognitive bias that limits a person to using an object only in the way it is traditionally used. It's a mental block that prevents individuals from seeing novel uses for an object beyond its conventional function, thereby hindering problem-solving. For example, if you need to hammer a nail but only have a wrench, functional fixedness might prevent you from seeing the wrench as a suitable hammer. Overcoming functional fixedness often requires a shift in perspective or a period of incubation."}],"cue":"Key Concept: Functional fixedness is a cognitive bias that limits a person to using an object only in the way it ...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q033","segment":"Research Methods","title":"Explain the research methods in cognitive psychology.","years":"Jun 2018 (1), Jun 2015 (1), Dec 2022 (1), Dec 2017 (1)","answer":[{"type":"paragraph","text":"Cognitive psychology employs various research methods to understand mental processes. These methods are broadly categorized into experimental, quasi-experimental, and correlational designs, often complemented by observational and neuroscientific techniques."},{"type":"list","items":["1.  Experimental Method: This is the most common method, allowing researchers to infer cause-and-effect relationships. It involves manipulating one or more independent variables (IVs) and measuring their effect on a dependent variable (DV), while controlling for extraneous variables. Participants are typically randomly assigned to conditions. For example, a researcher might manipulate the type of encoding strategy (IV) to see its effect on memory recall (DV)."]},{"type":"list","items":["2.  Quasi-Experimental Method: Used when random assignment is not possible or ethical (e.g., studying existing groups like clinical populations or age groups). Researchers select participants based on pre-existing characteristics and then observe the effects of an independent variable. While it allows for studying real-world phenomena, causal inferences are more limited due to potential confounding variables."]},{"type":"list","items":["3.  Correlational Method: This method examines the relationship between two or more variables without manipulating any of them. It determines the strength and direction of a relationship (e.g., positive, negative, or no correlation). While it can identify associations, it cannot establish causation. For instance, researchers might correlate hours of sleep with cognitive performance."]},{"type":"list","items":["4.  Observational Studies: Involve observing and recording behavior in naturalistic or laboratory settings. This can include naturalistic observation (observing behavior in its natural environment without intervention) or controlled observation (observing behavior in a structured setting). While useful for describing behavior, they don't explain causality."]},{"type":"list","items":["5.  Neuroscientific Methods: These methods link cognitive processes to brain activity. Techniques include:"]},{"type":"list","items":["6.  Computational Modeling and Simulation: Researchers create computer programs that simulate cognitive processes to test theories and make predictions about human behavior. This helps in understanding complex interactions within cognitive systems."]},{"type":"paragraph","text":"Each method has strengths and weaknesses, and cognitive psychologists often use a combination of these approaches to gain a comprehensive understanding of mental processes."}],"cue":"Key Concept: Cognitive psychology employs various research methods to understand mental processes...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q021","segment":"Wickelgren Strategies","title":"Explain Wickelgren’s general problem-solving strategies.","years":"Dec 2016 (1)","answer":[{"type":"paragraph","text":"Wayne A. Wickelgren (1974) proposed a set of general problem-solving strategies that are applicable across a wide range of problems, regardless of their specific content. These strategies are essentially heuristics, providing systematic approaches to finding solutions when a direct algorithm isn't available or obvious. His framework emphasizes the importance of transforming the problem or the solution space to make the problem more tractable."},{"type":"heading","level":4,"text":"Wickelgren identified several key strategies:"},{"type":"list","items":["1.  State-Action Tree Search: This is a foundational concept. It involves representing the problem as a tree where nodes are states (configurations of the problem) and branches are actions (operators) that transform one state into another. Problem-solving then becomes a search for a path from the initial state to the goal state. This strategy underpins many other methods."]},{"type":"list","items":["2.  Difference Reduction (Means-Ends Analysis): This is one of the most powerful and widely used strategies. It involves:"]},{"type":"list","items":["3.  Working Backward: This strategy involves starting from the desired goal state and applying operators in reverse to determine the steps needed to reach the initial state. It is particularly useful when the goal state is clearly defined, but the initial state or the path from it is ambiguous. For example, solving a maze by starting from the exit, or planning a complex project by defining the final deliverable and then identifying preceding steps."]},{"type":"list","items":["4.  Subgoal Decomposition: This involves breaking down a large, complex problem into smaller, more manageable sub-problems. Solving each subgoal sequentially ultimately leads to the solution of the overall problem. This is a common strategy for tackling overwhelming tasks (e.g., writing a book by first outlining chapters, then sections, then paragraphs). Means-ends analysis often naturally leads to subgoal decomposition."]},{"type":"list","items":["5.  Analogy: This strategy involves using the solution to a previously solved, similar problem to solve a new, current problem. It requires recognizing structural similarities between the two problems, even if their surface features are different. The problem solver maps the known solution from the source problem to the target problem. For instance, using a successful marketing strategy from one product to launch another."]},{"type":"list","items":["6.  Contradiction: This strategy involves assuming the opposite of what you want to prove or achieve, and then showing that this assumption leads to a contradiction. This indirect proof method can be effective in logic or mathematical problems."]},{"type":"list","items":["7.  Generalization and Specialization:"]},{"type":"paragraph","text":"Wickelgren emphasized that these strategies are not mutually exclusive and can often be combined. Effective problem-solvers are flexible in their use of these strategies, adapting their approach based on the nature of the problem and their progress towards a solution. His work provided a systematic framework for understanding and teaching problem-solving skills."}],"cue":"Key Concept: Wayne A...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q054","segment":"Working Memory","title":"Working Memory","years":"Dec 2016 (1)","answer":[{"type":"paragraph","text":"Working memory, a concept proposed by Baddeley and Hitch, is a limited-capacity system for temporarily holding and manipulating information during cognitive tasks. It's an active \"workbench\" of the mind, distinct from the passive storage of short-term memory. It comprises several components: the central executive (controls attention), the phonological loop (processes auditory information), and the visuospatial sketchpad (processes visual/spatial information). An episodic buffer was later added to integrate information across modalities. Working memory is crucial for reasoning, comprehension, and learning."}],"cue":"Key Concept: Working memory, a concept proposed by Baddeley and Hitch, is a limited-capacity system for temporari...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q062","segment":"Working Memory","title":"Concept of IQ","years":"Jun 2016 (1), Dec 2015 (1)","answer":[{"type":"paragraph","text":"IQ, or Intelligence Quotient, is a standardized score derived from intelligence tests designed to assess cognitive abilities. Historically, it was calculated as mental age divided by chronological age, multiplied by 100. Modern IQ scores are typically \"deviation IQs,\" representing an individual's performance relative to the average performance of their age group (with 100 being the average). IQ tests measure various cognitive domains like verbal comprehension, perceptual reasoning, working memory, and processing speed, and are used to predict academic and occupational success, though their scope in defining overall intelligence is debated."}],"cue":"Key Concept: IQ, or Intelligence Quotient, is a standardized score derived from intelligence tests designed to as...","examUse":"Format: Universal. Rule: Address all parts systematically."},{"id":"MPC-001-Q067","segment":"Working Memory","title":"Wechsler Intelligence Scales","years":"Jun 2016 (1)","answer":[{"type":"paragraph","text":"The Wechsler Intelligence Scales, developed by David Wechsler, are a series of individually administered intelligence tests widely used to assess cognitive ability in children and adults. The most common versions are the WAIS (Wechsler Adult Intelligence Scale), WISC (Wechsler Intelligence Scale for Children), and WPPSI (Wechsler Preschool and Primary Scale of Intelligence). These tests provide a Full Scale IQ score, along with index scores for specific cognitive domains like Verbal Comprehension, Perceptual Reasoning, Working Memory, and Processing Speed, offering a comprehensive profile of an individual's intellectual strengths and weaknesses."}],"cue":"Key Concept: The Wechsler Intelligence Scales, developed by David Wechsler, are a series of individually administ...","examUse":"Format: Universal. Rule: Address all parts systematically."}];
